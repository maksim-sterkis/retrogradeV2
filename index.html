}

// Both gameplay and the editor use this renderer; editing adds only guides on top.
function drawGameScene(ctx, canvas, scene) {
    const { level: currentLevel, camera, obstacles, zones: activeZones, items: activeItems,
        parallax: parallaxLayers, dust: ambientDust, particles, player, state, timer,
        thrusterFlicker = 0, menuShip = { active: false } } = scene;
    if (scene.background !== false) drawGameBackdrop(ctx, canvas, currentLevel, parallaxLayers, camera);

    ctx.save();
    let renderCamX = camera.x + (camera.shakeX || 0);
    let renderCamY = camera.y + (camera.shakeY || 0);
    ctx.translate(-renderCamX, -renderCamY);

    // Viewport-culled dot grid: only draw dots visible on screen
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    let dotStartX = Math.max(0, Math.floor(renderCamX / 100) * 100);
    let dotStartY = Math.max(0, Math.floor(renderCamY / 100) * 100);
    let dotEndX = Math.min(currentLevel.width, renderCamX + canvas.width + 100);
    let dotEndY = Math.min(currentLevel.height, renderCamY + canvas.height + 100);
    for (let x = dotStartX; x <= dotEndX; x += 100) {
        for (let y = dotStartY; y <= dotEndY; y += 100) {
            ctx.fillRect(x, y, 2, 2);
        }
    }

    // Render AoE Zones Backgrounds & Wind/Portal Effects
    if (state !== 'menu' && activeZones.length > 0) {
        for (let zone of activeZones) {
            ctx.fillStyle = zone.color || 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(zone.x, zone.y, zone.w, zone.h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(zone.x, zone.y, zone.w, zone.h);
            ctx.clip();

            let showZoneEffects = (saveData.visualEffects === 'high' || saveData.visualEffects === 'medium');

            if (zone.type === 'emp') {
                // Scanning disruptor line
                let scanY = (timer * 200) % zone.h;
                ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
                ctx.fillRect(zone.x, zone.y + scanY, zone.w, 8);

                // Static noise overlay only on high/medium settings
                if (showZoneEffects) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    for (let i = 0; i < 10; i++) {
                        let sx = zone.x + Math.random() * zone.w;
                        let sy = zone.y + Math.random() * zone.h;
                        ctx.fillRect(sx, sy, Math.random() * 20 + 10, 2);
                    }
                }
            } else if (zone.type === 'boost') {
                // Pulsing borders
                let pulse = (1 + Math.sin(timer * 15)) / 2;
                ctx.lineWidth = showZoneEffects ? (4 + pulse * 4) : 4;
                ctx.strokeStyle = showZoneEffects ? `rgba(0, 255, 255, ${0.8 - pulse * 0.5})` : 'rgba(0, 255, 255, 0.6)';
                ctx.strokeRect(zone.x + 2, zone.y + 2, zone.w - 4, zone.h - 4);
            } else if (zone.type === 'portal' || zone.type === 'portal_exit') {
                // Glowing portal effect (bloom)
                let pulse = (1 + Math.sin(timer * 5)) / 2;
                let portalColor = zone.color || 'rgba(200, 0, 255, 0.5)';

                if (showZoneEffects) {
                    ctx.shadowBlur = 15 + pulse * 20;
                    ctx.shadowColor = portalColor;
                }
                ctx.strokeStyle = portalColor;
                ctx.lineWidth = showZoneEffects ? (2 + pulse * 2) : 2;

                ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);
                ctx.fillStyle = portalColor.replace('0.4', '0.1').replace('0.5', '0.1'); // slight fill
                ctx.fillRect(zone.x, zone.y, zone.w, zone.h);
                ctx.shadowBlur = 0;
            } else {
                // Wind logic
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();

                let forceMag = Math.sqrt((zone.forceX || 0) * (zone.forceX || 0) + (zone.forceY || 0) * (zone.forceY || 0));
                if (forceMag > 0) {
                    let densityDivisor = showZoneEffects ? 8000 : 16000;
                    let numLines = Math.floor((zone.w * zone.h) / densityDivisor);
                    if (numLines === 0 && (zone.w * zone.h) > 0) {
                        numLines = 2; // Make sure at least a couple of lines are drawn for gameplay visibility
                    }
                    let speed = forceMag * 400; // Visual wind speed scalar
                    let angle = Math.atan2(zone.forceY, zone.forceX);
                    let cosA = Math.cos(angle);
                    let sinA = Math.sin(angle);

                    for (let i = 0; i < numLines; i++) {
                        // Seeded pseudo-random coordinates
                        let seedX = (i * 9301 + 49297) % 233280 / 233280;
                        let seedY = (i * 49297 + 9301) % 233280 / 233280;

                        let lineX = seedX * zone.w;
                        let lineY = seedY * zone.h;

                        let moveDist = timer * speed + (i * 100);

                        let drawX = (lineX + moveDist * cosA) % zone.w;
                        if (drawX < 0) drawX += zone.w;

                        let drawY = (lineY + moveDist * sinA) % zone.h;
                        if (drawY < 0) drawY += zone.h;

                        let absX = zone.x + drawX;
                        let absY = zone.y + drawY;

                        ctx.moveTo(absX, absY);
                        ctx.lineTo(absX - 15 * cosA, absY - 15 * sinA);
                    }
                }
                ctx.stroke();
            }
            ctx.restore();
        }
    }

// Draw Keys / Fuel Items
if (state !== 'menu' && activeItems.length > 0) {
    for (let item of activeItems) {
        if (!item.collected) {
            ctx.save();
            ctx.translate(item.x, item.y);
            let bounce = Math.sin(timer * 3) * 5;
            ctx.translate(0, bounce);

            if (item.type === 'fuel') {
                ctx.fillStyle = '#0f0';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0f0';
                ctx.fillRect(-15, -21, 30, 42);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 0;
                ctx.fillText("F", 0, 6);
            }
            ctx.restore();
        }
    }
}

ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
for (let p of ambientDust) {
    ctx.fillRect(p.x, p.y, 2, 2);
}

ctx.restore();
ctx.save();
renderCamX = camera.x + (camera.shakeX || 0);
renderCamY = camera.y + (camera.shakeY || 0);
ctx.translate(-renderCamX, -renderCamY);

if (state !== 'menu') {
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, currentLevel.width, currentLevel.height);
    ctx.strokeStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, currentLevel.height);
    ctx.lineTo(currentLevel.width, currentLevel.height);
    ctx.stroke();

    if (currentLevel.tutorialTexts) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        for (let t of currentLevel.tutorialTexts) {
            ctx.fillText(t.text, t.x, t.y);
        }
    }

    // Rendering Custom Arbitrary Polygons
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    for (let obs of obstacles) {
        ctx.beginPath();
        ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
        for (let i = 1; i < obs.vertices.length; i++) {
            ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
        }
        ctx.closePath();
        ctx.stroke();
    }

    if (typeof window.cachedPatterns === 'undefined') window.cachedPatterns = {};

    for (let obs of obstacles) {
        let pType = obs.texture;
        if (!pType) {
            pType = currentLevel.theme?.parallaxType;
            if (pType !== 'caves' && pType !== 'lightCaves') pType = 'metal';
        }

        if (!window.cachedPatterns[pType]) {
            if ((pType === 'caves' || pType === 'cave') && Textures.cave) window.cachedPatterns[pType] = ctx.createPattern(Textures.cave, 'repeat');
            else if ((pType === 'lightCaves' || pType === 'lightCave') && Textures.lightCave) window.cachedPatterns[pType] = ctx.createPattern(Textures.lightCave, 'repeat');
            else if (pType === 'metal' && Textures.metal) window.cachedPatterns[pType] = ctx.createPattern(Textures.metal, 'repeat');
            else if (pType === 'metalDark' && Textures.metalDark) window.cachedPatterns[pType] = ctx.createPattern(Textures.metalDark, 'repeat');
            else if (pType === 'hazard' && Textures.hazard) window.cachedPatterns[pType] = ctx.createPattern(Textures.hazard, 'repeat');
            else if (pType === 'strut' && Textures.strut) window.cachedPatterns[pType] = ctx.createPattern(Textures.strut, 'repeat');
            else if (pType === 'scaffold' && Textures.scaffold) window.cachedPatterns[pType] = ctx.createPattern(Textures.scaffold, 'repeat');
            else if (pType === 'asteroid' && Textures.asteroid) window.cachedPatterns[pType] = ctx.createPattern(Textures.asteroid, 'repeat');
        }

        ctx.save();
        let shouldAlign = obs.isIsolated || pType === 'strut' || pType === 'scaffold' || pType === 'metal' || pType === 'metalDark' || typeof obs.speed !== 'undefined';
        if (shouldAlign) {
            if (obs.isRotating && obs.currentAngle !== undefined) {
                ctx.translate(obs.cx, obs.cy);
                ctx.rotate(obs.currentAngle);
            } else {
                ctx.translate(obs.aabb.minX, obs.aabb.minY);
            }
        }
        
        ctx.fillStyle = window.cachedPatterns[pType] || currentLevel.theme?.obj || '#334155';

        ctx.beginPath();
        if (shouldAlign) {
            if (obs.isRotating && obs.currentAngle !== undefined) {
                ctx.moveTo(obs.baseVertices[0].x, obs.baseVertices[0].y);
                for (let i = 1; i < obs.baseVertices.length; i++) {
                    ctx.lineTo(obs.baseVertices[i].x, obs.baseVertices[i].y);
                }
            } else {
                ctx.moveTo(obs.vertices[0].x - obs.aabb.minX, obs.vertices[0].y - obs.aabb.minY);
                for (let i = 1; i < obs.vertices.length; i++) {
                    ctx.lineTo(obs.vertices[i].x - obs.aabb.minX, obs.vertices[i].y - obs.aabb.minY);
                }
            }
        } else {
            ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
            for (let i = 1; i < obs.vertices.length; i++) {
                ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
            }
        }
        ctx.closePath();
        ctx.fill();
        
        // Dynamic features for metal panels
        if (pType === 'metal' || pType === 'metalDark') {
            const localVertices = obs.isRotating ? obs.baseVertices : null;
            const localMinX = localVertices ? Math.min(...localVertices.map(v => v.x)) : 0;
            const localMinY = localVertices ? Math.min(...localVertices.map(v => v.y)) : 0;
            let bw = localVertices ? Math.max(...localVertices.map(v => v.x)) - localMinX : (obs.isMoving ? obs.w : obs.aabb.maxX - obs.aabb.minX);
            let bh = localVertices ? Math.max(...localVertices.map(v => v.y)) - localMinY : (obs.isMoving ? obs.h : obs.aabb.maxY - obs.aabb.minY);
            
            ctx.save();
            // Keep panel borders, braces and rivets inside the polygon outline.
            ctx.clip();
            if (localVertices) ctx.translate(localMinX, localMinY);
            if (!shouldAlign) {
                // If it wasn't aligned for the pattern fill, align it now so drawing is local
                ctx.translate(obs.aabb.minX, obs.aabb.minY);
            }
            
            // Determine how many grid panels to draw (split if > 4x default size of 128)
            let cols = Math.ceil(bw / 512);
            let rows = Math.ceil(bh / 512);
            let cellW = bw / cols;
            let cellH = bh / rows;
            
            ctx.lineWidth = 2;
            
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    let cx = Math.floor(c * cellW);
                    let cy = Math.floor(r * cellH);
                    let nextX = Math.floor((c + 1) * cellW);
                    let nextY = Math.floor((r + 1) * cellH);
                    let w = nextX - cx;
                    let h = nextY - cy;
                    
                    // Border for the cell
                    ctx.strokeStyle = pType === 'metalDark' ? 'rgba(0,0,0,0.9)' : 'rgba(0,0,0,0.8)';
                    ctx.strokeRect(cx + 1, cy + 1, w - 2, h - 2);
                    
                    if (pType === 'metal') {
                        // Cross brace
                        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.moveTo(cx + 1, cy + 1);
                        ctx.lineTo(cx + w - 1, cy + h - 1);
                        ctx.moveTo(cx + w - 1, cy + 1);
                        ctx.lineTo(cx + 1, cy + h - 1);
                        ctx.stroke();
                        
                        // Corner Rivets
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        
                        const drawRivet = (rx, ry) => {
                            ctx.beginPath();
                            ctx.arc(rx, ry, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        };
                        
                        drawRivet(cx + 12, cy + 12);
                        drawRivet(cx + w - 12, cy + 12);
                        drawRivet(cx + 12, cy + h - 12);
                        drawRivet(cx + w - 12, cy + h - 12);
                    }
                }
            }
            ctx.restore();
        }
        
        ctx.restore();
    }

    for (let pad of currentLevel.safePads) {
        if (Textures.safePad) {
            if (!window.cachedPatterns['safePad']) {
                window.cachedPatterns['safePad'] = ctx.createPattern(Textures.safePad, 'repeat');
            }
            ctx.fillStyle = window.cachedPatterns['safePad'];
            // Draw a box for the pad instead of just a line
            ctx.fillRect(pad.x, pad.y, pad.w, 10);
        }
        ctx.strokeStyle = pad.isTarget ? '#00FF00' : '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(pad.x, pad.y);
        ctx.lineTo(pad.x + pad.w, pad.y);
        ctx.stroke();

        ctx.fillStyle = pad.isTarget ? '#00FF00' : '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 14px monospace';

        let text = "SAFE PAD";
        if (pad.isStart) text = "LAUNCH PAD";
        if (pad.isTarget) text = "LANDING PAD";

        ctx.fillText(text, pad.x + (pad.w / 2), pad.y + 20);

        if (pad.isStart) {
            let targetPad = currentLevel.safePads.find(p => p.isTarget);
            if (targetPad) {
                let startCx = pad.x + pad.w / 2;
                let startCy = pad.y;
                let targetCx = targetPad.x + targetPad.w / 2;
                let targetCy = targetPad.y;

                let angle = Math.atan2(targetCy - startCy, targetCx - startCx);

                ctx.save();
                ctx.translate(startCx, startCy - 40);
                ctx.rotate(angle);

                ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';

                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(5, 10);
                ctx.lineTo(5, -10);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(100, 0);
                ctx.stroke();

                ctx.restore();
            }
        }
    }
}

let lightColor = currentLevel.theme?.light || '255, 255, 255';

ctx.save();
ctx.globalCompositeOperation = 'screen';
ctx.shadowBlur = 0;

let useBlur = (saveData.visualEffects === 'high' || saveData.visualEffects === 'medium');

for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    if (!p.active) continue;

    if (p.type === 'explosion') {
        let size = Math.max(0.1, p.life * 15);
        ctx.fillStyle = `rgba(255, 200, 50, ${p.life})`;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    } else if (p.type === 'spark') {
        if (useBlur) {
            ctx.shadowBlur = 10 * p.life;
            ctx.shadowColor = `rgba(255, 255, 0, ${p.life})`;
        }
        ctx.strokeStyle = `rgba(255, 200, 50, ${p.life * 1.5})`;
        ctx.lineWidth = 2 * p.life;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
        ctx.stroke();
        if (useBlur) ctx.shadowBlur = 0;
    } else if (p.type === 'exhaust') {
        let size = 3 + (1.0 - p.life) * 15;
        let alpha = p.life * 0.8;

        // Simplified color selection — avoid per-particle string construction when possible
        if (currentLevel.theme?.parallaxType === 'lightCaves') {
            if (p.life > 0.6) {
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
            } else if (p.life > 0.3) {
                ctx.fillStyle = `rgba(255, 150, 50, ${alpha})`;
            } else {
                ctx.fillStyle = `rgba(50, 50, 50, ${alpha * 0.5})`;
            }
        } else {
            if (p.life > 0.6) {
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            } else if (p.life > 0.3) {
                ctx.fillStyle = `rgba(${lightColor}, ${alpha})`;
            } else {
                ctx.fillStyle = `rgba(50, 50, 50, ${alpha * 0.5})`;
            }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawShipEntity(shipObj, flickerAmount) {
    ctx.save();
    ctx.translate(shipObj.x, shipObj.y);
    ctx.rotate(shipObj.angle);

    let activeFlicker = flickerAmount > 0 ? flickerAmount * (0.8 + Math.random() * 0.2) : 0;
    if (activeFlicker > 0.01) {
        ctx.save();
        const nozzleY = shipObj.h / 2;
        // A small nozzle flare fades on every edge. Draw the opaque hull over
        // its upper end instead of cutting a circular glow in half with a clip.
        ctx.globalCompositeOperation = 'screen';
        // Restore the broad environmental light with a full, soft falloff.
        // The hull is drawn afterward, so this never washes over its artwork.
        const ambientGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 500);
        ambientGrad.addColorStop(0, `rgba(${lightColor}, ${0.15 * activeFlicker})`);
        ambientGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
        ctx.fillStyle = ambientGrad;
        ctx.fillRect(-500, -500, 1000, 1000);

        ctx.translate(0, nozzleY + 3);
        ctx.scale(4, 10);
        const flareGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        flareGrad.addColorStop(0, `rgba(255, 255, 255, ${0.85 * activeFlicker})`);
        flareGrad.addColorStop(0.25, `rgba(${lightColor}, ${0.55 * activeFlicker})`);
        flareGrad.addColorStop(0.6, `rgba(${lightColor}, ${0.15 * activeFlicker})`);
        flareGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
        ctx.fillStyle = flareGrad;
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    drawShipHull(ctx, shipObj);

    ctx.restore();
}

ctx.restore();

if (scene.ghost) {
    ctx.save();ctx.translate(scene.ghost.x,scene.ghost.y);ctx.rotate(scene.ghost.angle);
    ctx.globalAlpha=0.35;ctx.fillStyle='#59dfff';ctx.strokeStyle='#b8f4ff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(10,15);ctx.lineTo(-10,15);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

if (state !== 'lost' && state !== 'menu' && scene.showPlayer !== false) {
    drawShipEntity(player, thrusterFlicker);
}

if (state === 'menu' && menuShip.active) {
    drawShipEntity(menuShip, menuShip.visualThrust);
}

ctx.restore();

if (scene.editor || scene.worldOnly) return;

if (state === 'victory') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';

    ctx.textAlign = 'center';
    ctx.font = 'bold 64px monospace';
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0ff';
    ctx.fillText("MISSION COMPLETE", GAME_WIDTH / 2, 180);

    ctx.font = 'bold 32px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText("CAMPAIGN CLEARED", GAME_WIDTH / 2, 250);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#55ffbb';
    ctx.fillText(victoryData.invalid ? "Run completed. Personal records unchanged." : "Personal records saved on this device.", GAME_WIDTH / 2, 280);
    if (cosmeticUnlockNotice) {
        ctx.font = '14px monospace'; ctx.fillStyle = '#a9bbc7';
        ctx.fillText(`APPEARANCE UNLOCKED: ${cosmeticUnlockNotice}`, GAME_WIDTH / 2, 520);
    }

    ctx.fillStyle = 'rgba(0, 10, 20, 0.8)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.fillRect(GAME_WIDTH / 2 - 320, 320, 300, 160);

    ctx.fillRect(GAME_WIDTH / 2 + 20, 320, 300, 160);
    ctx.strokeRect(GAME_WIDTH / 2 + 20, 320, 300, 160);

    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00ffcc';
    ctx.fillText("REAL TIME (RTA)", GAME_WIDTH / 2 - 170, 360);
    ctx.fillStyle = '#fff';
    ctx.font = '36px monospace';
    ctx.fillText(`${victoryData.rta.toFixed(3)}s`, GAME_WIDTH / 2 - 170, 410);

    }

    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00ffcc';
    ctx.fillText("IN-GAME (IGT)", GAME_WIDTH / 2 + 170, 360);
    ctx.fillStyle = '#fff';
    ctx.font = '36px monospace';
    ctx.fillText(`${victoryData.igt.toFixed(3)}s`, GAME_WIDTH / 2 + 170, 410);
    if (victoryData.newIGT) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 20px monospace';
        ctx.fillText("NEW PERSONAL BEST!", GAME_WIDTH / 2 + 170, 450);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    let pulse = Math.abs(Math.sin(Date.now() / 300));
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
    ctx.fillText(">> PRESS [ESC] TO RETURN TO MENU <<", GAME_WIDTH / 2, 580);
    return;
}

if (state === 'menu') {
    drawMenuUI();
} else {

    drawHUD();

    if (state === 'lost' || state === 'won') {
        const boxW = 500;
        const boxH = state === 'won' ? 240 : 200;
        const boxX = GAME_WIDTH / 2 - boxW / 2;
        const boxY = GAME_HEIGHT / 2 - boxH / 2;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(boxX, boxY, boxW, boxH);

        const mainColor = state === 'lost' ? '#ff3333' : '#0ff';
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 4;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.textAlign = 'center';

        if (state === 'lost') {
            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#ff3333';
            ctx.fillText("MISSION FAILED", GAME_WIDTH / 2, boxY + 70);
            
            ctx.fillStyle = '#fff';
            ctx.font = '18px monospace';
            ctx.fillText("Press [R] to Restart", GAME_WIDTH / 2, boxY + 120);
        } else {
            ctx.font = 'bold 36px monospace';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0ff';

            if (currentLevel.isCustom) {
                ctx.fillText("TEST FLIGHT COMPLETE", GAME_WIDTH / 2, boxY + 50);
            } else if (currentLevel.isTutorial) {
                ctx.fillText("TUTORIAL CLEARED", GAME_WIDTH / 2, boxY + 50);
            } else if (isPracticeMode) {
                ctx.fillText("PRACTICE CLEARED", GAME_WIDTH / 2, boxY + 50);
            } else {
                ctx.fillText("SUCCESS", GAME_WIDTH / 2, boxY + 50);
            }

            ctx.shadowBlur = 0;
            ctx.font = 'bold 24px monospace';
            ctx.fillStyle = '#0ff';
            ctx.fillText(`TIME: ${timer.toFixed(3)}s`, GAME_WIDTH / 2, boxY + 95);

            ctx.font = 'bold 20px monospace';
            if (currentLevel.isCustom) {
                ctx.fillStyle = '#a8c4cb';
                ctx.fillText("Your level is ready for another flight.", GAME_WIDTH / 2, boxY + 130);
            } else if (currentSplitStatus === 'UNRANKED') {
                ctx.fillStyle = '#a8c4cb';
                ctx.fillText('TIME NOT ELIGIBLE FOR RECORDS', GAME_WIDTH / 2, boxY + 130);
            } else if (currentSplitStatus === 'NEW') {
                ctx.fillStyle = '#FFD700';
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 10;
                ctx.fillText("NEW PB!", GAME_WIDTH / 2, boxY + 130);
            } else if (currentSplitStatus === 'FASTER') {
                ctx.fillStyle = '#0f0';
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 10;
                ctx.fillText(`-${Math.abs(currentSplitDelta).toFixed(3)}s PB!`, GAME_WIDTH / 2, boxY + 130);
            } else if (currentSplitStatus === 'SLOWER') {
                ctx.fillStyle = '#f00';
                ctx.fillText(`+${currentSplitDelta.toFixed(3)}s`, GAME_WIDTH / 2, boxY + 130);
            } else {
                ctx.fillStyle = '#888';
                ctx.fillText(`+0.000s`, GAME_WIDTH / 2, boxY + 130);
            }
            ctx.shadowBlur = 0;

            if (cosmeticUnlockNotice && !currentLevel.isCustom && !currentLevel.isTutorial) {
                ctx.font = '13px monospace'; ctx.fillStyle = '#a9bbc7';
                ctx.fillText(`APPEARANCE UNLOCKED: ${cosmeticUnlockNotice}`, GAME_WIDTH / 2, boxY + 160);
            }
            ctx.font = '18px monospace';
            ctx.fillStyle = '#fff';

            if (currentLevel.isCustom) {
                ctx.fillText("[ENTER] RETEST    [ESC] BACK TO EDITOR", GAME_WIDTH / 2, boxY + 190);
            } else if (currentLevel.isTutorial) {
                ctx.fillStyle = '#0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.fillText("HOLD [ESC] TO EXIT TO MAIN MENU", GAME_WIDTH / 2, boxY + 190);
                ctx.shadowBlur = 0;
            } else if (isPracticeMode) {
                ctx.fillText("Press [ENTER] to Restart", GAME_WIDTH / 2, boxY + 190);
            } else {
                ctx.fillText("Press [ENTER] to Proceed", GAME_WIDTH / 2, boxY + 190);
            }
        }
    }

    if (state !== 'menu' && tHoldTimer > 0 && !tTriggeredReset) {
        let barWidth = 300;
        let barHeight = 24;
        let pct = Math.min(1.0, tHoldTimer / 0.5);
        let barX = GAME_WIDTH / 2 - barWidth / 2;
        let barY = GAME_HEIGHT - 94;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(barX, barY, barWidth, barHeight);

        ctx.fillStyle = '#ff0';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0';
        ctx.fillRect(barX, barY, barWidth * pct, barHeight);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 16px monospace';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#000';
        ctx.fillText("HOLD T TO RESTART RUN", GAME_WIDTH / 2, barY - 10);
        ctx.shadowBlur = 0;
    }

    if (state !== 'menu' && escHoldTimer > 0) {
        let barWidth = 300;
        let barHeight = 24;
        let pct = Math.min(1.0, escHoldTimer / 1.0);
        let barX = GAME_WIDTH / 2 - barWidth / 2;
        let barY = GAME_HEIGHT - 60;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';

        ctx.fillStyle = '#0ff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0ff';

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 16px monospace';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#000';
        ctx.fillText("HOLD ESC TO QUIT", GAME_WIDTH / 2, barY - 10);
        ctx.shadowBlur = 0;
    }
}

if (terminalActive) {
    const termW = 600, termH = 110;
    const termX = GAME_WIDTH / 2 - termW / 2;

    ctx.font = 'bold 16px monospace';
    ctx.fillText(terminalStatus, termX + 20, termY + 78);

}

if (isPaused) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#00ffcc';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00ffcc';
    ctx.fillText("PAUSED", GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);

    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px monospace';
    let pulse = Math.abs(Math.sin(Date.now() / 300));
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
    ctx.fillText(">> PRESS [ENTER] TO RESUME <<", GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
}

if (transitionAlpha > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    let glitchIntensity = transitionAlpha * 40;
    ctx.globalCompositeOperation = 'screen';

    ctx.fillStyle = `rgba(255, 0, 0, ${transitionAlpha * 0.4})`;
    for (let i = 0; i < 5; i++) {
        ctx.fillRect((Math.random() - 0.5) * glitchIntensity, Math.random() * GAME_HEIGHT, GAME_WIDTH, Math.random() * 6 + 1);
    }

    ctx.fillStyle = `rgba(0, 200, 255, ${transitionAlpha * 0.4})`;
    for (let i = 0; i < 5; i++) {
        ctx.fillRect((Math.random() - 0.5) * glitchIntensity, Math.random() * GAME_HEIGHT, GAME_WIDTH, Math.random() * 6 + 1);
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${transitionAlpha * 0.3})`;
    for (let i = 0; i < 10; i++) {
        ctx.fillRect(0, Math.random() * GAME_HEIGHT, GAME_WIDTH, Math.random() * 3 + 1);
    }
    ctx.globalCompositeOperation = 'source-over';
}

// Physics always advances in 1/120-second steps. Rendering only reads snapshots.
const Simulation = {
    hz: 120,
    accumulator: 0,
    time: null,
    alpha: 1,
    stepping: false,
    frames: new WeakMap(),
    input: new Set(),
    pending: [],

    keyCode(event) {
        return event.code || ({ a: 'KeyA', d: 'KeyD', w: 'KeyW', arrowleft: 'ArrowLeft', arrowright: 'ArrowRight', arrowup: 'ArrowUp' })[event.key.toLowerCase()];
    },
    queueKey(event, down) {
        const code = this.keyCode(event);
        if (!['KeyA', 'KeyD', 'KeyW', 'ArrowLeft', 'ArrowRight', 'ArrowUp'].includes(code)) return;
        const time = Number.isFinite(event.timeStamp) ? event.timeStamp : lastTime;
        this.pending.push({ code, down, time });
    },
    clearInput() {
        this.input.clear();
        this.pending = [];
    },
    reset(time) {
        this.accumulator = 0;
        this.time = time;
        this.alpha = 1;
        this.frames = new WeakMap();
        this.pending = [];
        this.input = new Set();
        for (const [key, code] of Object.entries({ a:'KeyA', d:'KeyD', w:'KeyW', arrowleft:'ArrowLeft', arrowright:'ArrowRight', arrowup:'ArrowUp' })) {
            if (keys[key] || (SplitScreen.active && SplitScreen.held.has(code))) this.input.add(code);
        }
    },
    actions(index = null) {
        const codes = index === 1 ? ['ArrowLeft','ArrowRight','ArrowUp'] : ['KeyA','KeyD','KeyW'];
        const held = code => this.input.has(code) && (!SplitScreen.active || !SplitScreen.blocked.has(code));
        return {
            left: held(codes[0]) || (index === null && held('ArrowLeft')),
            right: held(codes[1]) || (index === null && held('ArrowRight')),
            thrust: held(codes[2]) || (index === null && held('ArrowUp'))
        };
    },
    snapshot(scene) {
        const entities = [scene.player, scene.camera, scene.menuShip, ...(scene.dust || []), ...(scene.particles || []).filter(p => p.active)];
        for (const entity of entities) {
            if (!entity) continue;
            this.frames.set(entity, { before: {
                x: entity.x, y: entity.y, angle: entity.angle, life: entity.life,
                active: entity.active, renderEpoch: entity.renderEpoch,
                shakeX: entity.shakeX, shakeY: entity.shakeY
            }, state: scene.state });
        }
        for (const obstacle of scene.obstacles || []) {
            if (obstacle.isMoving || obstacle.isRotating) this.frames.set(obstacle, { before: { currentAngle: obstacle.currentAngle, aabb: { ...obstacle.aabb }, vertices: obstacle.vertices.map(v => ({ ...v })) } });
        }
    },
    scenes() {
        if (SplitScreen.active) return SplitScreen.match.sessions;
        return [{ player, camera, menuShip, dust: ambientDust, particles, obstacles, state }];
    },
    advance(deltaTime, timestamp) {
        if (this.time === null) this.time = timestamp - deltaTime;
        this.accumulator += deltaTime;
        const step = 1000 / this.hz;
        while (this.accumulator + 1e-7 >= step) {
            this.time += step;
            while (this.pending.length && this.pending[0].time <= this.time + 1e-7) {
                const event = this.pending.shift();
                if (event.down) this.input.add(event.code); else this.input.delete(event.code);
            }
            for (const scene of this.scenes()) this.snapshot(scene);
            this.stepping = true;
            try {
                update(60 / this.hz);
            } finally { this.stepping = false; }
            this.accumulator = Math.max(0, this.accumulator - step);
        }
        this.alpha = this.accumulator / step;
    },
    entity(entity, state) {
        const frame = this.frames.get(entity);
        if (!frame || this.alpha >= 1 || (state !== undefined && frame.state !== state)) return entity;
        const before = frame.before;
        // New particles, teleports, or resets must never smear across the screen.
        if (entity.renderEpoch !== before.renderEpoch || entity.active !== before.active || (entity.life > before.life) || Math.hypot(entity.x - before.x, entity.y - before.y) > 128) return entity;
        const result = { ...entity };
        for (const field of ['x', 'y', 'angle', 'life', 'shakeX', 'shakeY']) {
            if (Number.isFinite(before[field]) && Number.isFinite(entity[field])) result[field] = before[field] + (entity[field] - before[field]) * this.alpha;
        }
        if (entity.isRotating && Number.isFinite(before.currentAngle) && Number.isFinite(entity.currentAngle)) {
            result.currentAngle = before.currentAngle + (entity.currentAngle - before.currentAngle) * this.alpha;
            const cos = Math.cos(result.currentAngle), sin = Math.sin(result.currentAngle);
            result.vertices = entity.baseVertices.map(v => ({ x: entity.cx + v.x * cos - v.y * sin, y: entity.cy + v.x * sin + v.y * cos }));
            result.aabb = {
                minX: Math.min(...result.vertices.map(v => v.x)), maxX: Math.max(...result.vertices.map(v => v.x)),
                minY: Math.min(...result.vertices.map(v => v.y)), maxY: Math.max(...result.vertices.map(v => v.y))
            };
        } else {
            if (entity.aabb && before.aabb) result.aabb = Object.fromEntries(Object.keys(entity.aabb).map(key => [key, before.aabb[key] + (entity.aabb[key] - before.aabb[key]) * this.alpha]));
            if (entity.vertices && before.vertices) result.vertices = entity.vertices.map((v, i) => ({ x: before.vertices[i].x + (v.x - before.vertices[i].x) * this.alpha, y: before.vertices[i].y + (v.y - before.vertices[i].y) * this.alpha }));
        }
        return result;
    },
    scene(scene) {
        if (isPaused || !this.frames.has(scene.player) || this.frames.get(scene.player).state !== scene.state) return scene;
        return {
            ...scene,
            player: this.entity(scene.player, scene.state), camera: this.entity(scene.camera, scene.state),
            menuShip: scene.menuShip && this.entity(scene.menuShip, scene.state),
            dust: scene.dust.map(p => this.entity(p)), particles: scene.particles.map(p => p.active ? this.entity(p) : p),
            obstacles: scene.obstacles.map(o => this.entity(o))
        };
    }
};

// Run clocks count simulation ticks, never rendered frames. Legacy seconds remain
// an unchanged base when a checkpoint resumes. The game's RTA excludes pauses.
const RunTiming = {
    hz: 120,
    rta: { base: 0, ticks: 0, last: 0 },
    igt: { base: 0, ticks: 0, last: 0 },
    nextLevel: 0,
    reset(rta = 0, igt = 0, nextLevel = 0) {
        ReplayRecorder.resetRun(nextLevel, rta, igt);
        this.rta = { base: rta, ticks: 0, last: rta };
        this.igt = { base: igt, ticks: 0, last: igt };
        this.nextLevel = nextLevel;
        currentRunRTA = rta; currentRunIGT = igt;
    },
    add(counter, current, ticks) {
        // Supports restored legacy values without rounding them to the tick grid.
        if (current !== counter.last) { counter.base = current; counter.ticks = 0; }
        counter.ticks += ticks;
        counter.last = counter.base + counter.ticks / this.hz;
        return counter.last;
    },
    tick(dt) {
        if (runState === 'active' && !isPracticeMode && !currentLevel?.isTutorial && !currentLevel?.isCustom &&
            !['menu', 'won', 'victory', 'editor'].includes(state) && !isPaused && !document.hidden) {
            ReplayRecorder.runTick();
            currentRunRTA = this.add(this.rta, currentRunRTA, Math.round(dt * 2));
        }
    },
    complete(index, time) {
        if (index !== this.nextLevel || !validRecordTime(time)) runInvalidated = true;
        else this.nextLevel++;
        if (currentRunIGT !== this.igt.last) { this.igt.base = currentRunIGT; this.igt.ticks = 0; }
        if (soloFlightClock.last === time) {
            this.igt.base += soloFlightClock.base;
            this.igt.ticks += soloFlightClock.ticks;
        } else this.igt.base += time;
        this.igt.last = this.igt.base + this.igt.ticks / this.hz;
        currentRunIGT = this.igt.last;
    },
    captureCheckpoint() {
        if (customFinalLevel!==null || runState !== 'active' || isPracticeMode || isSpeedrunMode || currentLevel?.isTutorial || currentLevel?.isCustom ||
            this.nextLevel < 1 || this.nextLevel >= levels.length) return false;
        // Level and both clocks are always taken from the same live run.
        SaveStore.checkpointDirty = true;
        saveData.campaignProgress = this.nextLevel;
        saveData.casualRTA = currentRunRTA; saveData.casualIGT = currentRunIGT;
        saveData.casualTimingValid = !runInvalidated;
        ReplayRecorder.checkpoint();
        return true;
    }
};

function tickFlightClock(session, dt) {
    const clock = session.clock || (session.clock = { base: 0, ticks: 0, last: 0 });
    session.timer = RunTiming.add(clock, session.timer, Math.round(dt * 2));
}

const RecordEvidence = {
    value(game,record) {
        return record==='rta'?game.bestRTA:record==='igt'?game.bestIGT:record==='tutorial'?game.bestTutorial:game.bestLevels[Number(record.slice(6))];
    },
    records(checked) {
        const h=checked.replay.header;
        if(!checked.completed)return [];
        return h.kind==='campaign'?[['rta',checked.rta],['igt',checked.igt]]:
            [[h.segments[0].level===-1?'tutorial':`level:${h.segments[0].level}`,checked.igt]];
    },
    descriptor(checked,value) {
        return {version:1,value,digest:checked.digest,courseDigest:checked.courseDigest,rules:checked.rules,physics:checked.physics};
    },
    matches(proof,checked,value) {
        return proof&&canonicalSave(proof)===canonicalSave(this.descriptor(checked,value));
    },
    bind(entry,game=saveData,replace=false) {
        if(!entry.checked||entry.key.startsWith('import:'))return false;
        game.recordEvidence ||= {};
        let changed=false;
        for(const [record,value] of this.records(entry.checked)){
            if(this.value(game,record)!==value)continue;
            const prior=game.recordEvidence[record];
            if(!prior||replace){
                const next=this.descriptor(entry.checked,value);
                if(canonicalSave(prior)!==canonicalSave(next)){game.recordEvidence[record]=next;changed=true;}
            }
        }
        return changed;
    }
};

const ReplayMenu = {
    filter: 'all', selected: null, cache: null,
    groups() {
        const rows=ReplayLibrary.rows();
        if(this.cache&&this.cache.filter===this.filter&&rows.length===this.cache.rows.length&&rows.every((entry,i)=>entry===this.cache.rows[i]))return this.cache.groups;
        const groups=[];
        for(const entry of rows){
            if(this.filter==='runs'&&!['campaign','test'].includes(entry.replay.header.kind))continue;
            if(this.filter==='best'&&!entry.key.startsWith('best:')||this.filter==='recent'&&!entry.key.startsWith('last:')||this.filter==='imported'&&!entry.key.startsWith('import:'))continue;
            const bytes=entry.replay.bytes,hash=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength).getUint32(bytes.length-4,true);
            const id=`${hash}-${bytes.length}`;
            let group=groups.find(group=>group.id===id&&(group.entry.replay===entry.replay||group.entry.replay.bytes.every((byte,i)=>byte===bytes[i])));
            if(group){group.aliases.push(entry);if(entry.key.startsWith('best:'))group.entry=entry;}
            else groups.push({id: `${id}${groups.some(group=>group.id===id)?'-'+groups.length:''}`,entry,aliases:[entry]});
        }
        // Keep campaign recordings together, then list flights by descending course.
        const course=group=>['campaign','test'].includes(group.entry.replay.header.kind)?Infinity:group.entry.replay.header.segments[0].level;
        groups.sort((a,b)=>course(a)===course(b)?0:course(a)>course(b)?-1:1);
        this.cache={rows,filter:this.filter,groups};return groups;
    },
    label(group) {
        const roles=[];
        if(group.entry.replay.header.kind==='test')roles.push('INVALID / TEST RUN');
        if(group.aliases.some(entry=>entry.key==='best:campaign:rta'))roles.push('Best RTA');
        if(group.aliases.some(entry=>entry.key==='best:campaign:igt'))roles.push('Best IGT');
        if(group.aliases.some(entry=>entry.key.startsWith('best:')&&!entry.key.startsWith('best:campaign:')))roles.push('Best time');
        if(group.aliases.some(entry=>entry.key==='last:campaign'))roles.push('Latest run');
        if(group.aliases.some(entry=>entry.key==='last:flight'))roles.push('Latest attempt');
        if(group.aliases.some(entry=>entry.key.startsWith('import:')))roles.push('Imported');
        if(group.aliases.some(entry=>entry.key.startsWith('session:')))roles.push('Unsaved');

function handleReplayButton(id) {
    if(id==='watch_rta'||id==='watch_igt'){
        const entry=ReplayLibrary.campaignEntry(id==='watch_rta'?'rta':'igt');
        if(entry){menuScreen='replays';ReplayMenu.filter='runs';ReplayMenu.selected=null;ReplayLibrary.page=0;ReplayPlayer.play(entry);}
        return true;
    }
    if(id==='replays'){menuScreen='replays';ReplayLibrary.page=0;ReplayMenu.selected=null;ReplayLibrary.audit();return true;}
    if(id==='back_replays'){menuScreen='times';return true;}
    if(id.startsWith('replay_filter_')){const filter=id.slice(14);if(['all','best','runs','recent','imported'].includes(filter)){ReplayMenu.filter=filter;ReplayMenu.selected=null;ReplayLibrary.page=0;ReplayLibrary.deletePending=null;}return true;}
    if(id.startsWith('select_replay_')){const group=ReplayMenu.groups()[Number(id.slice(14))];if(group)ReplayMenu.selected=group.id;ReplayLibrary.deletePending=null;return true;}
    if(id==='import_replay'){ReplayLibrary.chooseFile();return true;}
    if(id==='toggle_ghost'){saveData.showGhost=saveData.showGhost===false;storeSaveData();if(saveData.showGhost===false)ReplayRecorder.ghost=null;return true;}
    if(id==='replays_prev'){ReplayLibrary.page--;return true;}
    if(id==='replays_next'){ReplayLibrary.page++;return true;}
    const match=id.match(/^(watch|export|race|delete)_replay_(\d+)$/);if(!match)return false;
    const group=ReplayMenu.groups()[Number(match[2])],entry=group?.entry;if(!entry)return true;
    if(match[1]==='watch')ReplayPlayer.play(entry);
    if(match[1]==='export')ReplayLibrary.download(entry);
    if(match[1]==='delete'){
        if(ReplayLibrary.deletePending===group.id){
            Promise.all(group.aliases.map(alias=>ReplayLibrary.remove(alias))).then(()=>{ReplayMenu.selected=null;});
            ReplayLibrary.deletePending=null;
        }else{ReplayLibrary.deletePending=group.id;}
    }else ReplayLibrary.deletePending=null;
    if(match[1]==='race') {
        ReplayLibrary.status='Checking ghost flight...';
        ReplayLibrary.check(entry).then(checked=>{
            if(state!=='menu'||menuScreen!=='replays'||ReplayMenu.selected!==group.id||!checked.completed)return;
            const index=entry.replay.header.segments[0].level;
            isPracticeMode=true;runState='inactive';currentLevelIndex=index;
            loadLevel(index);ReplayLibrary.generation++;ReplayRecorder.ghost=checked;
            saveData.showGhost=true;storeSaveData();ReplayLibrary.status='';
        }).catch(error=>ReplayLibrary.status=`Ghost rejected: ${error.message}`);
    }
    return true;
}

const CloudRace = {
    entry: null, intervals: [], launch: 0,
    clear() { this.entry = null; this.intervals = []; },
    start(entry) {
        this.clear(); this.entry = entry;
        let elapsed = 0, offset = 0;
        for (const segment of entry.replay.header.segments) {
            this.intervals.push({ start: elapsed, end: elapsed + segment.frames, offset, segment });
            elapsed += segment.frames + segment.waitTicks; offset += segment.frames;
        }
        this.launch = 0;
        if (entry.replay.header.kind === 'campaign') {
            while (this.launch < entry.replay.frames && !(ReplayFormat.pose(entry.replay, this.launch).flags & 7)) this.launch++;
        }
    },
    pose() {
        if (!this.entry || saveData.showGhost === false) return null;
        const replay = this.entry.replay;
        if (replay.header.kind === 'flight') {
            if (currentLevelIndex !== replay.header.segments[0].level || !hasMoved) return null;
            return this.at(replay.header.segments[0].launchTick + Math.max(0, soloFlightClock.ticks - 2 + Simulation.alpha));
        }
        if (runState !== 'active') return null;
        const time = Math.max(0, currentRunRTA * 120 - 1 + Simulation.alpha) + this.launch;
        const interval = this.intervals.find(s => time >= s.start && time < s.end);
        if (!interval || interval.segment.level !== currentLevelIndex) return null;
        return this.at(interval.offset + time - interval.start);
    },
    at(tick) {
        const replay = this.entry.replay, i = Math.floor(tick), a = ReplayFormat.pose(replay, i), b = ReplayFormat.pose(replay, i + 1);
        if (!a || (a.flags & 16)) return null;
        if (!b || this.intervals.some(interval => interval.offset + interval.segment.frames === i + 1)) return a;
        if (b.flags & 8) return b;
        const alpha = tick - i;
        return { x: a.x + (b.x - a.x) * alpha, y: a.y + (b.y - a.y) * alpha,
            angle: a.angle + getNormalizedAngle({ angle: b.angle - a.angle }) * alpha };
    }
};

let globalError = null;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    if (globalError) return;
    try {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        CloudBoard.updateLevelInput();

        if (ReplayPlayer.active) {
            Simulation.reset(timestamp);
            if (document.hidden || deltaTime >= 250) ReplayPlayer.paused = true;
            else ReplayPlayer.advance(Math.max(0, deltaTime));
            ReplayPlayer.draw();
            requestAnimationFrame(gameLoop);
            return;
        }

        const editor = LevelEditor;
        if (editor.active && !editor.testing) {
            Simulation.reset(timestamp);
            editor.render();
            requestAnimationFrame(gameLoop);
            return;
        }

        // Long interruptions pause gameplay instead of dropping simulation time.
        if (document.hidden || deltaTime >= 250) {
            if (SplitScreen.active) SplitScreen.pause();
            else if (state === 'playing') isPaused = true;
            keys = {};
        }
        applyRenderScale(saveData.renderScale);
        if (isPaused || document.hidden || deltaTime >= 250) Simulation.reset(timestamp);
        else Simulation.advance(Math.max(deltaTime, 0), timestamp);
        if (typeof MusicSystem !== 'undefined') MusicSystem.setState(SplitScreen.active ? 'playing' : state);
        draw();
        if(ReplayRecorder.restoring){ctx.font='13px monospace';ctx.fillStyle='#bfeef1';ctx.textAlign='center';ctx.fillText('Checking saved run recording...',GAME_WIDTH/2,30);}

        // FPS counter (top-right)
        _fpsFrames++;
        _fpsTime += deltaTime;
        if (_fpsTime >= 500) {
            _fpsDisplay = Math.round((_fpsFrames / _fpsTime) * 1000);
            _fpsFrames = 0;
            _fpsTime = 0;
        }
        if (saveData.showFPS) {
            ctx.fillStyle = '#0f0';
            ctx.font = '14px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`${_fpsDisplay} FPS`, GAME_WIDTH - 10, GAME_HEIGHT - 10);
        }

        requestAnimationFrame(gameLoop);
    } catch (e) {
        globalError = e;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.fillStyle = '#f00';
        ctx.font = '16px monospace';
        ctx.textAlign = 'left';
        ctx.fillText("CRITICAL ERROR: " + e.message, 50, 50);
        ctx.fillText(e.stack.split('\n')[1] || "", 50, 80);
        ctx.fillText(e.stack.split('\n')[2] || "", 50, 110);
    }
}

function flushSessionSave() {
    if (ReplayPlayer.active) return;
    if (LevelEditor.active) { LevelEditor.persist(); return; }
    const captured = RunTiming.captureCheckpoint();
    if (captured || _saveScheduled || SaveStore.status.startsWith('NOT SAVED')) storeSaveDataImmediate();
}
window.addEventListener('pagehide', flushSessionSave);
document.addEventListener?.('visibilitychange', () => {
    if (!document.hidden) return;
    ReplayRecorder.event('pause');
    if (ReplayPlayer.active) { ReplayPlayer.paused = true; return; }
    if (SplitScreen.active) SplitScreen.pause();
    else if (state !== 'menu') isPaused = true;
    keys = {}; Simulation.clearInput();
    flushSessionSave();
});
window.addEventListener('beforeunload', e => {
    flushSessionSave();
    if ((state !== 'menu' && !LevelEditor.active) || CloudAccount.hasUnsyncedChanges()) { e.preventDefault(); e.returnValue = ''; }
});

applyRenderScale(saveData.renderScale);
goToMenu();
CloudUI.init();
if (typeof location !== 'undefined' && location.hash === '#editor') LevelEditor.open();
requestAnimationFrame(gameLoop);

    </script>
