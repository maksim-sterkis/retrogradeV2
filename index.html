const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_WIDTH = 1280, GAME_HEIGHT = 720;
const RENDER_SCALES = [0.25, 0.5, 0.75, 1];

function getOutputResolution() {
    const rect = canvas.getBoundingClientRect();
    const borderX = (canvas.clientLeft || 0) * (canvas.offsetWidth ? rect.width / canvas.offsetWidth : 1);
    const borderY = (canvas.clientTop || 0) * (canvas.offsetHeight ? rect.height / canvas.offsetHeight : 1);
    const pixelRatio = window.devicePixelRatio || 1;
    return {
        width: Math.round(Math.max(0, rect.width - 2 * borderX) * pixelRatio),
        height: Math.round(Math.max(0, rect.height - 2 * borderY) * pixelRatio)
    };
}

function applyRenderScale(scale) {
    const output = getOutputResolution();
    if (!output.width || !output.height) return;
    const width = Math.max(1, Math.round(output.width * scale));
    const height = Math.max(1, Math.round(output.height * scale));
    if (canvas.width === width && canvas.height === height) return;
    canvas.width = width;
    canvas.height = height;
    ctx.setTransform(width / GAME_WIDTH, 0, 0, height / GAME_HEIGHT, 0, 0);
}

    <script>
const Textures = {};

function generateProceduralTextures() {
    // Cave/Rock Texture
    let caveCanvas = document.createElement('canvas');
    caveCanvas.width = 512;
    caveCanvas.height = 512;
    let caveCtx = caveCanvas.getContext('2d');
    caveCtx.fillStyle = '#0a0f14';
    caveCtx.fillRect(0, 0, 512, 512);

    // Background noise
    for (let i = 0; i < 4000; i++) {
        caveCtx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.05})`;
        let x = Math.random() * 512;
        let y = Math.random() * 512;
        let w = Math.random() * 16 + 4;
        let h = Math.random() * 16 + 4;
        for (let ox of [-512, 0, 512]) {
            for (let oy of [-512, 0, 512]) {
                caveCtx.fillRect(x + ox, y + oy, w, h);
            }
        }
    }

    // Additional blocky noise instead of circles
    for (let i = 0; i < 200; i++) {
        let cx = Math.random() * 512;
        let cy = Math.random() * 512;
        let w = Math.random() * 40 + 20;
        let h = Math.random() * 40 + 20;

        for (let ox of [-512, 0, 512]) {
            for (let oy of [-512, 0, 512]) {
                caveCtx.fillStyle = `rgba(0, 0, 0, 0.2)`;
                caveCtx.fillRect(cx + ox, cy + oy, w, h);

                caveCtx.fillStyle = `rgba(255, 255, 255, 0.02)`;
                caveCtx.fillRect(cx + ox + w * 0.2, cy + oy + h * 0.2, w * 0.6, h * 0.6);
            }
        }
    }
    Textures.cave = caveCanvas;

    // Asteroid Texture
    let asteroidCanvas = document.createElement('canvas');
    asteroidCanvas.width = 512;
    asteroidCanvas.height = 512;
    let asteroidCtx = asteroidCanvas.getContext('2d');
    asteroidCtx.fillStyle = '#d0d0d0'; // Light moon gray
    asteroidCtx.fillRect(0, 0, 512, 512);

    // Background noise
    for (let i = 0; i < 4000; i++) {
        asteroidCtx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3})`;
        asteroidCtx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 16 + 4, Math.random() * 16 + 4);
        asteroidCtx.fillStyle = `rgba(100, 100, 100, ${Math.random() * 0.2})`;
        asteroidCtx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 16 + 4, Math.random() * 16 + 4);
    }

    // Additional blocky craters/rocks
    for (let i = 0; i < 250; i++) {
        let cx = Math.random() * 512;
        let cy = Math.random() * 512;
        let w = Math.random() * 40 + 20;
        let h = Math.random() * 40 + 20;

        for (let ox of [-512, 0, 512]) {
            for (let oy of [-512, 0, 512]) {
                asteroidCtx.fillStyle = `rgba(120, 120, 120, 0.4)`; // darker grey shadows
                asteroidCtx.fillRect(cx + ox, cy + oy, w, h);

                asteroidCtx.fillStyle = `rgba(255, 255, 255, 0.4)`; // bright highlights
                asteroidCtx.fillRect(cx + ox + w * 0.2, cy + oy + h * 0.2, w * 0.6, h * 0.6);
            }
        }
    }
    Textures.asteroid = asteroidCanvas;

    // Light Cave Texture (Sandstone)
    let lightCaveCanvas = document.createElement('canvas');
    lightCaveCanvas.width = 512;
    lightCaveCanvas.height = 512;
    let lightCaveCtx = lightCaveCanvas.getContext('2d');
    lightCaveCtx.fillStyle = '#a88d6c'; // Sandy brown base
    lightCaveCtx.fillRect(0, 0, 512, 512);

    // Background noise
    for (let i = 0; i < 4000; i++) {
        lightCaveCtx.fillStyle = `rgba(209, 187, 161, ${Math.random() * 0.15})`; // Lighter sand noise
        let x = Math.random() * 512;
        let y = Math.random() * 512;
        let w = Math.random() * 16 + 4;
        let h = Math.random() * 16 + 4;
        for (let ox of [-512, 0, 512]) {
            for (let oy of [-512, 0, 512]) {
                lightCaveCtx.fillRect(x + ox, y + oy, w, h);
            }
        }
    }

    // Additional blocky noise instead of circles
    for (let i = 0; i < 200; i++) {
        let cx = Math.random() * 512;
        let cy = Math.random() * 512;
        let w = Math.random() * 40 + 20;
        let h = Math.random() * 40 + 20;

        for (let ox of [-512, 0, 512]) {
            for (let oy of [-512, 0, 512]) {
                lightCaveCtx.fillStyle = `rgba(138, 113, 86, 0.3)`; // Darker brown shadow
                lightCaveCtx.fillRect(cx + ox, cy + oy, w, h);

                lightCaveCtx.fillStyle = `rgba(230, 205, 180, 0.2)`; // Bright sandstone highlight
                lightCaveCtx.fillRect(cx + ox + w * 0.2, cy + oy + h * 0.2, w * 0.6, h * 0.6);
            }
        }
    }
    Textures.lightCave = lightCaveCanvas;

    // Machinery/Metal Texture
    let metalCanvas = document.createElement('canvas');
    metalCanvas.width = 128;
    metalCanvas.height = 128;
    let metalCtx = metalCanvas.getContext('2d');
    metalCtx.fillStyle = '#303e50';
    metalCtx.fillRect(0, 0, 128, 128);
    // Add subtle noise
    for(let i=0; i<100; i++) {
        metalCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        metalCtx.fillRect(Math.random()*128, Math.random()*128, Math.random()*20, Math.random()*20);
    }
    
    // Draw panel lines - aligned to edges for seamless tiling
    Textures.metal = metalCanvas;

    // Dark Metal Texture (for large backgrounds)
    let metalDarkCanvas = document.createElement('canvas');
    metalDarkCanvas.width = 128;
    metalDarkCanvas.height = 128;
    let metalDarkCtx = metalDarkCanvas.getContext('2d');
    metalDarkCtx.fillStyle = '#1a222f';
    metalDarkCtx.fillRect(0, 0, 128, 128);
    for(let i=0; i<150; i++) {
        metalDarkCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.05)';
        metalDarkCtx.fillRect(Math.random()*128, Math.random()*128, Math.random()*30, Math.random()*30);
    }
    Textures.metalDark = metalDarkCanvas;

    // Hazard Stripes Texture
    let hazardCanvas = document.createElement('canvas');
    hazardCanvas.width = 64;
    hazardCanvas.height = 64;
    let hazardCtx = hazardCanvas.getContext('2d');
    hazardCtx.fillStyle = '#222';
    hazardCtx.fillRect(0, 0, 64, 64);
    hazardCtx.fillStyle = '#ffaa00';
    for (let i = -64; i < 128; i += 32) {
        hazardCtx.beginPath();
        hazardCtx.moveTo(i, 0);
        hazardCtx.lineTo(i + 16, 0);
        hazardCtx.lineTo(i + 16 - 64, 64);
        hazardCtx.lineTo(i - 64, 64);
        hazardCtx.fill();
    }
    hazardCtx.strokeStyle = 'rgba(0,0,0,0.8)';
    hazardCtx.lineWidth = 4;
    hazardCtx.strokeRect(0, 0, 64, 64);
    Textures.hazard = hazardCanvas;

    // Strut/Beam Texture (Girder)
    let strutCanvas = document.createElement('canvas');
    strutCanvas.width = 50;
    strutCanvas.height = 50;
    let strutCtx = strutCanvas.getContext('2d');
    
    strutCtx.fillStyle = '#2a3648'; // Base inner metal
    strutCtx.fillRect(0, 0, 50, 50);
    
    // Diagonal cross struts
    strutCtx.strokeStyle = '#1d2531';
    strutCtx.lineWidth = 5;
    strutCtx.beginPath();
    strutCtx.moveTo(0, 0);
    strutCtx.lineTo(50, 50);
    strutCtx.moveTo(50, 0);
    strutCtx.lineTo(0, 50);
    strutCtx.stroke();
    
    // Highlight on diagonals
    strutCtx.strokeStyle = 'rgba(255,255,255,0.05)';
    strutCtx.lineWidth = 2;
    strutCtx.beginPath();
    strutCtx.moveTo(0, 0);
    strutCtx.lineTo(50, 50);
    strutCtx.moveTo(50, 0);
    strutCtx.lineTo(0, 50);
    strutCtx.stroke();
    
    // Flanges (Border frame)
    strutCtx.fillStyle = '#3e4e63';
    strutCtx.fillRect(0, 0, 50, 6); // Top
    strutCtx.fillRect(0, 44, 50, 6); // Bottom
    strutCtx.fillRect(0, 0, 6, 50); // Left
    strutCtx.fillRect(44, 0, 6, 50); // Right
    
    // Flange border lines
    strutCtx.strokeStyle = 'rgba(0,0,0,0.8)';
    strutCtx.lineWidth = 2;
    strutCtx.strokeRect(1, 1, 48, 48);
    strutCtx.strokeRect(6, 6, 38, 38); // Inner box
    
    // Small rivets
    strutCtx.fillStyle = 'rgba(0,0,0,0.7)';
    strutCtx.beginPath();
    let rivets = [3, 25, 47];
    for (let rx of rivets) {
        for (let ry of rivets) {
            if (rx === 25 && ry === 25) continue; // Skip center
            strutCtx.arc(rx, ry, 1, 0, Math.PI * 2);
            strutCtx.closePath();
        }
    }
    strutCtx.fill();
    Textures.strut = strutCanvas;

    // Scaffold / Facility Texture (For Level 7)
    let scaffoldCanvas = document.createElement('canvas');
    scaffoldCanvas.width = 200;
    scaffoldCanvas.height = 200;
    let scaffoldCtx = scaffoldCanvas.getContext('2d');
    
    scaffoldCtx.fillStyle = '#1f2735'; 
    scaffoldCtx.fillRect(0, 0, 200, 200);
    
    // Grid/Lattice lines
    scaffoldCtx.strokeStyle = '#121822';
    scaffoldCtx.lineWidth = 16;
    scaffoldCtx.beginPath();
    // Hexagonal or dense grid feel
    for (let x = 0; x <= 200; x += 50) {
        scaffoldCtx.moveTo(x, 0);
        scaffoldCtx.lineTo(x, 200);
    }
    for (let y = 0; y <= 200; y += 50) {
        scaffoldCtx.moveTo(0, y);
        scaffoldCtx.lineTo(200, y);
    }
    scaffoldCtx.stroke();
    
    // Highlight lines
    scaffoldCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    scaffoldCtx.lineWidth = 4;
    scaffoldCtx.stroke();

    // Dark connection nodes
    scaffoldCtx.fillStyle = '#0f131a';
    for (let x = 0; x <= 200; x += 50) {
        for (let y = 0; y <= 200; y += 50) {
            scaffoldCtx.fillRect(x - 10, y - 10, 20, 20);
        }
    }
    Textures.scaffold = scaffoldCanvas;

    // Safe Pad Texture (Hazard Stripes)
    let padCanvas = document.createElement('canvas');
    padCanvas.width = 64;
    padCanvas.height = 64;
    let padCtx = padCanvas.getContext('2d');
    padCtx.fillStyle = '#ffcc00';
    padCtx.fillRect(0, 0, 64, 64);
    padCtx.fillStyle = '#222';
    for (let i = -64; i < 128; i += 32) {
        padCtx.beginPath();
        padCtx.moveTo(i, 0);
        padCtx.lineTo(i + 16, 0);
        padCtx.lineTo(i + 16 - 64, 64);
        padCtx.lineTo(i - 64, 64);
        padCtx.fill();
    }
    Textures.safePad = padCanvas;
}

// Generate textures on load
generateProceduralTextures();

    <script>
const AudioSystem = {
    ctx: null,
    enabled: true,
    engineNode: null,
    engineGain: null,
    masterGain: null,
    effectsGain: null,

    init: function () {
        if (!this.enabled || this.ctx) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.effectsGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.effectsGain.connect(this.masterGain);
            this.updateVolumes();
            
            if (typeof MusicSystem !== 'undefined') {
                MusicSystem.init(this.ctx);
                MusicSystem.start();
            }
        } catch (e) {
            console.warn("Web Audio API not supported");
            this.enabled = false;
        }
    },

    updateVolumes: function () {
        if (this.masterGain) this.masterGain.gain.value = saveData.masterVolume;
        if (this.effectsGain) this.effectsGain.gain.value = saveData.effectsVolume;
        if (typeof MusicSystem !== 'undefined') MusicSystem.updateVolume();
    },

    playBlip: function (freq = 440, type = 'square', duration = 0.1) {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.effectsGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    playExplosion: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 1.5; // 1.5 seconds
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 1.5);
        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.effectsGain);
        noise.start();
    },

    startEngine: function () {
        if (!this.ctx) this.init();
        if (!this.ctx || this.engineNode) return;
        let bufferSize = this.ctx.sampleRate * 2.0;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        this.engineNode = this.ctx.createBufferSource();
        this.engineNode.buffer = buffer;
        this.engineNode.loop = true;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; // Deep rumble
        this.engineGain = this.ctx.createGain();
        this.engineGain.gain.value = 0;
        this.engineNode.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.effectsGain);
        this.engineNode.start();
    },

    updateEngine: function (thrustAmount) {
        if (!this.engineGain) return;
        // Directly set value to prevent timeline memory leak from thousands of events
        this.engineGain.gain.value = thrustAmount * 0.3;
    },

    stopEngine: function () {
        if (this.engineNode) {
            this.engineNode.stop();
            this.engineNode.disconnect();
            this.engineGain.disconnect();
            this.engineNode = null;
            this.engineGain = null;
        }
    },

    playGlitch: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 0.3;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2000, this.ctx.currentTime);
        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.effectsGain);
        noise.start();
    },

    playSafeLand: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        this.playBlip(440, 'sine', 0.2);
        setTimeout(() => this.playBlip(554, 'sine', 0.3), 100);
        setTimeout(() => this.playBlip(659, 'sine', 0.4), 200);
    }
};

// Start audio context on first interaction
window.addEventListener('keydown', () => {
    if (!AudioSystem.ctx) AudioSystem.init();
}, { once: true });
window.addEventListener('mousedown', () => {
    if (!AudioSystem.ctx) AudioSystem.init();
}, { once: true });

    <script>
const MusicSystem = {
    ctx: null,
    musicGain: null,
    enabled: true,
    
    bpm: 110,
    currentStep: 0,
    nextNoteTime: 0,
    lookahead: 25.0, // ms
    scheduleAheadTime: 0.1, // s
    timerID: null,
    
    state: 'menu', // menu, playing, intense, death, victory
    
    // Scale: C Minor (C, D, Eb, F, G, Ab, Bb)
    scale: [0, 2, 3, 5, 7, 8, 10], 
    rootFreq: 130.81, // C3
    
    init: function(audioCtx) {
        if (!this.enabled) return;
        this.ctx = audioCtx;
        this.musicGain = this.ctx.createGain();
        this.updateVolume();
        
        if (typeof AudioSystem !== 'undefined' && AudioSystem.masterGain) {
            this.musicGain.connect(AudioSystem.masterGain);
        } else {
            this.musicGain.connect(this.ctx.destination);
        }
    },

    updateVolume: function() {
        if (this.musicGain && typeof saveData !== 'undefined') {
            // Default music volume to 0.5 if undefined
            if (saveData.musicVolume === undefined) saveData.musicVolume = 0.5;
            this.musicGain.gain.value = saveData.musicVolume * 0.7; // Lowered by 30% globally
        }
    },

    start: function() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume(); // Ensure context is running
        if (this.timerID) return;
        this.currentStep = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
        this.scheduler();
    },

    stop: function() {
        if (this.timerID) {
            clearTimeout(this.timerID);
            this.timerID = null;
        }
    },

    setState: function(newState) {
        if (this.state === newState) return;
        this.state = newState;
        
        if (!this.ctx) return;

        // Immediate stingers
        try {
            let t = this.ctx.currentTime + 0.05;
            if (newState === 'lost') {
                this.playChord([0, 1, 6], 0.1, 1.5, 0.15, t, 'sawtooth'); // Dissonant crash (very low volume)
            } else if (newState === 'victory' || newState === 'won') {
                this.playChord([0, 4, 7, 12], 0.5, 3.0, 0.8, t, 'sine'); // C Major triumph
            }
        } catch (e) {
            console.warn("MusicSystem stinger error:", e);
        }
    },

    getFreq: function(degree, octaveOffset = 0) {
        let noteIndex = degree % this.scale.length;
        let octave = Math.floor(degree / this.scale.length) + octaveOffset;
        if (noteIndex < 0) {
            noteIndex += this.scale.length;
            octave -= 1;
        }
        let semitones = this.scale[noteIndex] + (octave * 12);
        return this.rootFreq * Math.pow(2, semitones / 12);
    },

    getIntensityLevel: function() {
        if (typeof currentLevel !== 'undefined' && currentLevel && currentLevel.isTutorial) return -1;
        if (typeof currentLevelIndex === 'undefined') return 0;
        return currentLevelIndex;
    },

    scheduler: function() {
        while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
            this.scheduleNote(this.currentStep, this.nextNoteTime);
            this.nextNote();
        }
        this.timerID = setTimeout(() => this.scheduler(), this.lookahead);
    },

    nextNote: function() {
        const secondsPerBeat = 60.0 / this.bpm;
        this.nextNoteTime += 0.25 * secondsPerBeat; // 16th notes
        this.currentStep = (this.currentStep + 1) % 16;
    },

    scheduleNote: function(step, time) {
        if (this.state === 'lost' || this.state === 'victory' || this.state === 'won') {
            // Stop regular beat on lost/victory, just let the ambient chords play if any
            if ((this.state === 'victory' || this.state === 'won') && step === 0) {
                this.playChord([0, 4, 7], 2, 4.0, 0.4, time, 'triangle');
            }
            return;
        }

        let iLvl = this.getIntensityLevel();

        // Tutorial Track (iLvl < 0)
        if (iLvl < 0 && this.state === 'playing') {
            // Training simulation vibe: very sparse, slow pulse
            if (step % 8 === 0) {
                this.playKick(time);
            }
            if (step === 0) {
                let chord = [0, 4, 7]; // C Major
                this.playChord(chord, 1.0, 3.0, 0.4, time, 'sine');
            }
            return; // Skip the rest of the normal gameplay track
        }

        // Drums (only during gameplay)
        if (this.state === 'playing' || this.state === 'intense') {
            let beatVol = (iLvl >= 0 && iLvl < 10) ? 0.7 : 1.0; // Reduce beats by 30% in opening levels
            
            // Kick on 0, 4, 8, 12
            if (step % 4 === 0) {
                this.playKick(time, beatVol);
            }
            
            // Hihats scale with level intensity up to 23
            if (iLvl >= 10 || this.state === 'intense') {
                if (step % 4 === 2) this.playHat(time, 0.05 * beatVol); // offbeat hats (quieter)
            }
        }

        // Bassline (only during gameplay)
        if (this.state === 'playing' || this.state === 'intense') {
            let bassPattern = [0, 0, 0, 0,  2, 2, 2, 2,  4, 4, 4, 4,  -1, -1, 0, 0];
            let note = bassPattern[Math.floor(step / 2)];
            
            if (iLvl < 10 && this.state !== 'intense') {
                // Sparse bass
                if (step % 8 === 0) this.playBass(note, time, 0.4);
            } else {
                // Standard 8th note bass
                if (step % 2 === 0) this.playBass(note, time, 0.4);
            }
        }

        // Beautiful Synth Melody (Level 21+)
        if (this.state === 'playing' && iLvl >= 20 || this.state === 'intense') {
            // A catchy, triumphant 16-step melody pattern
            let melody = [7, -1, 9, -1, 4, -1, -1, 2, 4, -1, 7, -1, 0, -1, 2, -1];
            if (melody[step] !== -1) {
                this.playNiceMelody(melody[step], time);
            }
        }

        // Ambient Chords (Every bar/16 steps)
        if (step === 0) {
            // 8-bar progression to reduce repetitiveness
            let chordProg = [
                [0, 2, 4],    // Cm
                [4, 6, 8],    // Gm
                [3, 5, 7],    // F
                [-1, 1, 3],   // Bb
                [0, 2, 4],    // Cm
                [4, 6, 8],    // Gm
                [5, 7, 9],    // Ab
                [7, 10, 14]   // Gmaj
            ];
            // Advance chord every bar based on time
            let bar = Math.floor(time * (this.bpm / 60) / 4) % 8;
            let chord = chordProg[bar];
            
            if (this.state === 'menu') {
                this.playChord(chord, 1.0, 6.0, 0.6, time, 'sine');
            } else if (this.state === 'playing' || this.state === 'intense') {
                this.playChord(chord, 1.0, 2.0, 0.4, time, 'triangle');
            }
        }
    },

    playKick: function(time, volScale = 1.0) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.musicGain);

        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);

        gain.gain.setValueAtTime(0.8 * volScale, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

        osc.start(time);
        osc.stop(time + 0.5);
    },

    playHat: function(time, vol = 0.2) {
        let bufferSize = this.ctx.sampleRate * 0.1;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 5000;

        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        noise.start(time);
    },

    playBass: function(degree, time, volScale=1.0) {
        let freq = this.getFreq(degree, -1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, time);
        filter.frequency.exponentialRampToValueAtTime(100, time + 0.2);

        gain.gain.setValueAtTime(0.5 * volScale, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 0.2);
    },

    playNiceMelody: function(degree, time) {
        let freq = this.getFreq(degree, 1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();
        
        // A nice, bright square wave with a filter sweep
        osc.type = 'square';
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2000, time);
        filter.frequency.exponentialRampToValueAtTime(300, time + 0.15);
        
        gain.gain.setValueAtTime(0.02, time); // Quieter melody
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 0.2);
    },

    playLead: function(degree, time) {
        let freq = this.getFreq(degree, 1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        // Slow attack and decay for a sweeping pad/lead sound
        gain.gain.setValueAtTime(0.01, time);
        gain.gain.linearRampToValueAtTime(0.3, time + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 2.0);

        osc.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 2.0);
    },

    playChord: function(degrees, attack, decay, vol, time, type='triangle') {
        try {
            let t = time;
            if (t <= this.ctx.currentTime) t = this.ctx.currentTime + 0.01;
            
            degrees.forEach(degree => {
                let freq = this.getFreq(degree, 0);
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.01, t);
                gain.gain.linearRampToValueAtTime(vol / degrees.length, t + attack);
                gain.gain.exponentialRampToValueAtTime(0.01, t + attack + decay);

                osc.connect(gain);
                gain.connect(this.musicGain);

                osc.start(t);
                osc.stop(t + attack + decay);
            });
        } catch (e) {
            console.warn("MusicSystem playChord error:", e);
        }
    }
};

const ShipCosmetics = {

// The same clipped layers render in flight, on cards, and in the full preview.
function drawShipHull(ctx, ship, selected = ShipCosmetics.equipped()) {
    ctx.save();
    ctx.shadowBlur = 0;
    if (ship.w !== 20 || ship.h !== 30) ctx.scale(ship.w / 20, ship.h / 30);
    const halfWidth = 10, top = -15, bottom = 15;
    const height = bottom - top;
    const centerY = (top + bottom * 2) / 3;
    const triangle = (scale = 1) => {
        ctx.beginPath();
        ctx.moveTo(0, centerY + (top - centerY) * scale);
        ctx.lineTo(halfWidth * scale, centerY + (bottom - centerY) * scale);
        ctx.lineTo(-halfWidth * scale, centerY + (bottom - centerY) * scale);
        ctx.closePath();
    };
    triangle(); ctx.fillStyle = ShipCosmetics.color(selected.base); ctx.fill();
    ctx.save();
    // Clip to the actual hull. The outline covers the edge, with no inset gaps.
    triangle(); ctx.clip();

    // Middle: repeated or full-hull patterns.
    ctx.save();
    ctx.fillStyle = ctx.strokeStyle = ShipCosmetics.color(selected.middleColor);
    ctx.globalAlpha *= 0.75;
    if (selected.middle === 'split') ctx.fillRect(0, top, halfWidth, height);
    else if (selected.middle === 'stripes') {
        // Broad, evenly spaced diagonal bands cross the whole hull.
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (const y of [-6, 2, 10]) {
            ctx.moveTo(-12, y + 6);
            ctx.lineTo(12, y - 6);
        }
        ctx.stroke();
    } else if (selected.middle === 'dots') {
        // Three large dots stay legible at flight size.
        for (const [x, y] of [[0, -2], [-4, 9], [4, 9]]) {
            ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
        }
    } else if (selected.middle === 'grid') {
        // Three families of parallel lines form a triangular grid.
        ctx.lineWidth = 1.4; ctx.beginPath();
        for (let division = 1; division < 3; division++) {
            const t = division / 3, x = halfWidth * t, y = top + height * t;
            ctx.moveTo(-x, y); ctx.lineTo(x, y);
            ctx.moveTo(x, y); ctx.lineTo(-halfWidth + 2 * x, bottom);
            ctx.moveTo(-x, y); ctx.lineTo(halfWidth - 2 * x, bottom);
        }
        ctx.stroke();
    } else if (selected.middle === 'chevrons') {
        // Three evenly spaced chevrons with crisp tips and open gaps.
        ctx.lineWidth = 2.6;
        ctx.lineJoin = 'miter';
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (const tip of [-7, 1, 9]) {
            ctx.moveTo(-12, tip + 7.2); ctx.lineTo(0, tip); ctx.lineTo(12, tip + 7.2);
        }
        ctx.stroke();
    }
    ctx.restore();

    // Top: one small symbol with a dark edge to separate it from the pattern.
    if (selected.top !== 'none') {
        ctx.fillStyle = ShipCosmetics.color(selected.topColor);
        ctx.strokeStyle = '#091119'; ctx.lineWidth = 1; ctx.lineJoin = 'round';
        ctx.beginPath();
        if (selected.top === 'line') ctx.rect(-1, centerY - 4.5, 2, 9);
        else if (selected.top === 'triangle') triangle(0.4);
        else if (selected.top === 'diamond') {
            ctx.moveTo(0, centerY - 5); ctx.lineTo(3.4, centerY); ctx.lineTo(0, centerY + 5); ctx.lineTo(-3.4, centerY); ctx.closePath();
        }
        else if (selected.top === 'cross') {
            const arm = 3.8, stem = 1.1;
            ctx.moveTo(-stem, centerY - arm); ctx.lineTo(stem, centerY - arm); ctx.lineTo(stem, centerY - stem); ctx.lineTo(arm, centerY - stem);
            ctx.lineTo(arm, centerY + stem); ctx.lineTo(stem, centerY + stem); ctx.lineTo(stem, centerY + arm); ctx.lineTo(-stem, centerY + arm);
            ctx.lineTo(-stem, centerY + stem); ctx.lineTo(-arm, centerY + stem); ctx.lineTo(-arm, centerY - stem); ctx.lineTo(-stem, centerY - stem); ctx.closePath();
        } else if (selected.top === 'ring') ctx.arc(0, centerY, 3.4, 0, Math.PI * 2);
        if (selected.top === 'ring') {
            ctx.lineWidth = 3.5; ctx.stroke();
            ctx.lineWidth = 1.7; ctx.strokeStyle = ctx.fillStyle; ctx.stroke();
        } else { ctx.stroke(); ctx.fill(); }
    }
    ctx.restore();
    triangle(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineJoin = 'miter'; ctx.stroke();
    ctx.restore();
}

    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.bestLevels)) throw new Error('Invalid game save.');
    const revision = parsed.campaignRevision ?? 1;
    if (!Number.isSafeInteger(revision) || revision < 1 || revision > CAMPAIGN_LAYOUT_REVISION) throw new Error('Unsupported campaign revision.');
    if (strict && revision === CAMPAIGN_LAYOUT_REVISION && parsed.bestLevels.length !== levels.length) throw new Error('Incomplete level records.');
    const data = defaultSaveData();
    if (typeof parsed.replayGeneration === 'string' && /^[a-zA-Z0-9_-]{1,80}$/.test(parsed.replayGeneration)) data.replayGeneration = parsed.replayGeneration;
    if(parsed.recordEvidence!==undefined){
        if(!parsed.recordEvidence||typeof parsed.recordEvidence!=='object'||Array.isArray(parsed.recordEvidence))throw Error('Invalid record evidence.');
        for(const [record,proof] of Object.entries(parsed.recordEvidence)){
            if(!/^(rta|igt|tutorial|level:\d{1,2})$/.test(record)||!proof||proof.version!==1||
                !validRecordTime(proof.value)||!['digest','courseDigest'].every(key=>typeof proof[key]==='string'&&/^[a-f0-9]{64}$/.test(proof[key]))||
                !['rules','physics'].every(key=>typeof proof[key]==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(proof[key])))throw Error('Invalid record evidence.');
            data.recordEvidence[record]={version:1,value:proof.value,digest:proof.digest,courseDigest:proof.courseDigest,rules:proof.rules,physics:proof.physics};
        }
    }
    const time = value => {
        if (value === null || value === undefined) return null;
        if (!validRecordTime(value)) {
            if (strict) throw new Error('Invalid record time.');
            return null;
        }
        return value;
    };
    if (parsed.bestLevels.length > 50 || (parsed.bestRTASplits !== undefined && !Array.isArray(parsed.bestRTASplits))) throw new Error('Invalid record arrays.');
    data.bestLevels = migrateArray(parsed.bestLevels.map(time), undefined, 'individual', revision);
    data.bestRTASplits = migrateArray((parsed.bestRTASplits || []).map(time), undefined, 'splits', revision);
    data.bestTutorial = time(parsed.bestTutorial);
    if (parsed.bestLevels.length === levels.length) {
        data.bestRTA = time(parsed.bestRTA); data.bestIGT = time(parsed.bestIGT);
    }
    for (const key of ['campaignProgress', 'casualRTA', 'casualIGT']) if (parsed[key] !== undefined) data[key] = parsed[key];
    for (const key of ['casualLayoutValid', 'casualTimingValid', 'showTimer', 'showFPS', 'showTotalSpeed', 'showGhost']) {
        if (typeof parsed[key] === 'boolean') data[key] = parsed[key];
    }
    for (const key of ['masterVolume', 'effectsVolume', 'musicVolume']) {
        if (Number.isFinite(parsed[key])) data[key] = Math.max(0, Math.min(1, parsed[key]));
    }
    if (['high', 'medium', 'low'].includes(parsed.visualEffects)) data.visualEffects = parsed.visualEffects;
    if (RENDER_SCALES.includes(parsed.renderScale)) data.renderScale = parsed.renderScale;
    if (revision < CAMPAIGN_LAYOUT_REVISION) applyCampaignRevision(revision, true, data);
    sanitizeCampaignCheckpoint(data);
    data.cosmetics = ShipCosmetics.normalized(parsed.cosmetics, !parsed.cosmetics, data);
    // Legacy records have no run trace. Reject contradictory aggregates without
    // inventing a run from individual bests. Incomplete IL tables may be resets.
    const minimum = data.bestLevels.reduce((sum, time) => sum + (time || 0), 0);
    let prefixMinimum = 0, previousSplit = 0;
    data.bestRTASplits = data.bestRTASplits.map((split, index) => {
        prefixMinimum += data.bestLevels[index] || 0;
        if (split === null || split < prefixMinimum - 0.05 || split < previousSplit) return null;
        previousSplit = split;
        return split;
    });
    if ((data.bestIGT !== null && data.bestIGT < minimum - 0.05) ||
        (data.bestRTA !== null && data.bestRTA < minimum - 0.05) ||
        (data.bestRTA !== null && data.bestIGT !== null && data.bestRTA < data.bestIGT - 0.05)) {
        data.bestRTA = null; data.bestIGT = null;
    }
    return data;
}

function validRecordTime(value) { return Number.isFinite(value) && value > 0 && value <= Number.MAX_SAFE_INTEGER / 120; }

let _saveScheduled = false;
function storeSaveData() {
    if (_saveScheduled) return;
    _saveScheduled = true;
    queueMicrotask(() => {
        if (!_saveScheduled) return;
        _saveScheduled = false;
        SaveStore.commit();
    });
}
function storeSaveDataImmediate() {
    _saveScheduled = false;
    return SaveStore.commit();
}

// Match the saved V1 course data against current V2 courses, including moved courses.
function canonicalCourseLayout(course) {
    return JSON.stringify(course, (key, value) => {
        if (key === 'theme' || key === 'name') return undefined;
        if (value && typeof value === 'object' && !Array.isArray(value)) {
            return Object.fromEntries(Object.entries(value).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0));
        }
        return value;
    });
}

    <script>
let volumeDrag = null;
let suppressSliderClick = false;

function canvasPointerPosition(e) {
    const rect = canvas.getBoundingClientRect();
    // Exclude the CSS border so pointer and drawing coordinates match when scaled.
    const scaleX = canvas.offsetWidth ? rect.width / canvas.offsetWidth : 1;
    const scaleY = canvas.offsetHeight ? rect.height / canvas.offsetHeight : 1;
    const borderX = (canvas.clientLeft || 0) * scaleX;
    const borderY = (canvas.clientTop || 0) * scaleY;
    return {
        x: (e.clientX - rect.left - borderX) * GAME_WIDTH / (rect.width - 2 * borderX),
        y: (e.clientY - rect.top - borderY) * GAME_HEIGHT / (rect.height - 2 * borderY)
    };
}

function setSliderValue(slider, x) {
    if (slider.id === 'render_scale') {
        const position = Math.max(0, Math.min(1, (x - slider.x) / slider.w));
        const scale = RENDER_SCALES[Math.round(position * (RENDER_SCALES.length - 1))];
        if (scale !== saveData.renderScale) {
            saveData.renderScale = scale;
            applyRenderScale(scale);
        }
        return;
    }
    const volumeKeys = {
        master_volume: 'masterVolume',
        effects_volume: 'effectsVolume',
        music_volume: 'musicVolume'
    };
    const key = volumeKeys[slider.id];
    if (!key) return;
    saveData[key] = Math.max(0, Math.min(1, (x - slider.x) / slider.w));
    AudioSystem.updateVolumes();
}

function finishVolumeDrag() {
    if (!volumeDrag) return;
    const pointerId = volumeDrag.pointerId;
    volumeDrag = null;
    if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
    storeSaveData();
}

window.addEventListener('mousemove', e => {
    const point = canvasPointerPosition(e);
    mouseX = point.x;
    mouseY = point.y;
});

window.addEventListener('pointerdown', e => {
    if (typeof CloudUI !== 'undefined' && CloudUI.open) return;
    suppressSliderClick = false;
    if (e.target !== canvas || e.button !== 0 || e.isPrimary === false || state !== 'menu' || menuScreen !== 'settings') return;
    const point = canvasPointerPosition(e);
    const slider = activeUIButtons.find(b => b.isSlider && point.x >= b.x && point.x <= b.x + b.w && point.y >= b.y && point.y <= b.y + b.h);
    if (!slider) return;
    volumeDrag = { ...slider, pointerId: e.pointerId };
    suppressSliderClick = true;
    canvas.setPointerCapture(e.pointerId);
    setSliderValue(slider, point.x);
});

window.addEventListener('pointermove', e => {
    if (typeof CloudUI !== 'undefined' && CloudUI.open) return;
    if (!volumeDrag || e.pointerId !== volumeDrag.pointerId) return;
    setSliderValue(volumeDrag, canvasPointerPosition(e).x);
});

window.addEventListener('pointerup', e => {
    if (typeof CloudUI !== 'undefined' && CloudUI.open) return;
    if (!volumeDrag || e.pointerId !== volumeDrag.pointerId) return;
    setSliderValue(volumeDrag, canvasPointerPosition(e).x);
    finishVolumeDrag();
});

window.addEventListener('pointercancel', finishVolumeDrag);
canvas.addEventListener('lostpointercapture', finishVolumeDrag);
window.addEventListener('blur', finishVolumeDrag);

window.addEventListener('click', e => {
    if (typeof CloudUI !== 'undefined' && CloudUI.open) return;
    if (ReplayPlayer.active) {
        const point = canvasPointerPosition(e);
        const button = activeUIButtons.find(b => point.x >= b.x && point.x <= b.x+b.w && point.y >= b.y && point.y <= b.y+b.h);
        if (button) ReplayPlayer.button(button.id);
        return;
    }
    if (suppressSliderClick) {
        suppressSliderClick = false;
        return;
    }
    if (SplitScreen.active) {
        if (e.target !== canvas) return;
        const point = canvasPointerPosition(e);
        const button = activeUIButtons.find(b => point.x >= b.x && point.x <= b.x + b.w && point.y >= b.y && point.y <= b.y + b.h);
        if (button) SplitScreen.handleButton(button.id);
        return;
    }
    if (state === 'menu') {
        const { x: cx, y: cy } = canvasPointerPosition(e);

        let clickedBtn = null;
        if (typeof activeUIButtons !== 'undefined') {
            for (let b of activeUIButtons) {
                if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
                    clickedBtn = b;
                    break;
                }
            }
        }

        if (clickedBtn) {
            let id = clickedBtn.id;
            if (id === 'account') { CloudUI.show(); return; }
            if (id === 'test_server') { CloudAccount.ping(); return; }
            if (CloudBoard.button(id) || SplitScreen.handleButton(id) || handleReplayButton(id)) return;
            
            if (id === 'begin') {
                menuScreen = 'main';
            } else if (id === 'play') {
                isPracticeMode = false;
                currentLevelIndex = 0;
                if (!isSpeedrunMode && customFinalLevel===null) {
                    SaveStore.checkpointDirty = true;
                    saveData.campaignProgress = 0;
                    saveData.casualRTA = 0;
                    saveData.casualIGT = 0;
                    saveData.casualLayoutValid = true;
                    saveData.casualTimingValid = true;
                }
                runInvalidated = false;
                runState = 'inactive';
                RunTiming.reset();
                hasMoved = false;
                storeSaveData();
                loadLevel(currentLevelIndex);
            } else if (id === 'continue') {
                let isContinueDisabled = isSpeedrunMode || saveData.campaignProgress === 0;
                if (!isContinueDisabled) {
                    isPracticeMode = false;
                    currentLevelIndex = saveData.campaignProgress;
                    if (currentLevelIndex >= levels.length) currentLevelIndex = 0;
                    runInvalidated = cheatsEnabled || customFinalLevel !== null || !saveData.casualLayoutValid || !saveData.casualTimingValid;
                    runState = 'active';
                    RunTiming.reset(saveData.casualRTA || 0, saveData.casualIGT || 0, currentLevelIndex);
                    hasMoved = false;
                    loadLevel(currentLevelIndex);
                }
            } else if (id === 'practice') {
                menuScreen = 'practice';
                practicePage = 0;
            } else if (id === 'tutorial') {
                isPracticeMode = false;
                loadLevel(-1);
            } else if (id === 'times') {
                menuScreen = 'times';
                timesPage = 0;
                ReplayLibrary.audit();
            } else if (id === 'editor') {
                LevelEditor.open();
            } else if (id === 'saveload') {
                menuScreen = 'saveload';
                loadStatus = "";
                SaveStore.pendingRestore = null;
            } else if (id === 'settings') {
                menuScreen = 'settings';
            } else if (id === 'appearance') {
                cosmeticPreview = ShipCosmetics.equipped();
                cosmeticLayer = 'base';
                menuScreen = 'appearance';
            } else if (id.startsWith('cosmetic_layer_')) {
                const layer = id.slice('cosmetic_layer_'.length);
                if (['base', 'middle', 'top'].includes(layer)) cosmeticLayer = layer;
            } else if (id.startsWith('cosmetic_item_')) {
                const item = id.slice('cosmetic_item_'.length);
                if (ShipCosmetics.get(cosmeticLayer, item)) cosmeticPreview[cosmeticLayer] = item;
            } else if (id.startsWith('cosmetic_color_')) {
                const color = id.slice('cosmetic_color_'.length);
                if (cosmeticLayer !== 'base' && ShipCosmetics.get('base', color)) cosmeticPreview[`${cosmeticLayer}Color`] = color;
            } else if (id === 'equip_look') {
                ShipCosmetics.equip(cosmeticPreview);
            } else if (id === 'back_settings' || id === 'back_saveload' || id === 'back_appearance') {
                menuScreen = 'main';
            } else if (id === 'speedrun_mode') {
                isSpeedrunMode = !isSpeedrunMode;
                if (isSpeedrunMode) {
                    cheatsEnabled = false;
                    customFinalLevel = null;
                    activeCheatPrefix = null;
                    cheatPrefixTimer = 0;
                }
            } else if (id === 'visual_effects') {
                if (saveData.visualEffects === 'high') saveData.visualEffects = 'medium';
                else if (saveData.visualEffects === 'medium') saveData.visualEffects = 'low';
                else saveData.visualEffects = 'high';
                
                if (saveData.visualEffects === 'high') MAX_PARTICLES = 800;
                else if (saveData.visualEffects === 'medium') MAX_PARTICLES = 400;
                else MAX_PARTICLES = 200;
                particles = Array.from({ length: MAX_PARTICLES }, () => ({
                    active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: 'exhaust'
                }));
                particleIndex = 0;
                storeSaveData();
            } else if (id === 'show_timer') {
                saveData.showTimer = !saveData.showTimer;
                storeSaveData();
            } else if (id === 'show_fps') {
                saveData.showFPS = !saveData.showFPS;
                storeSaveData();
            } else if (id === 'show_total_speed') {
                saveData.showTotalSpeed = !saveData.showTotalSpeed;
                storeSaveData();
            } else if (id === 'terminal_speedrun') {
                allowTerminalInSpeedrun = !allowTerminalInSpeedrun;

            } else if (id === 'download_backup') {
                SaveStore.downloadBackup();
            } else if (id === 'restore_backup') {
                SaveStore.chooseBackup();
            } else if (id === 'confirm_restore') {
                SaveStore.restoreBackup();
            } else if (id === 'cancel_restore') {
                SaveStore.pendingRestore = null; loadStatus = '';
            } else if (id === 'retry_save') {
                storeSaveDataImmediate();
            } else if (clickedBtn.isSlider) {
                setSliderValue(clickedBtn, cx);
                storeSaveData();
            } else if (id.startsWith('practice_level_')) {
                let actualIndex = parseInt(id.split('_')[2], 10);
                isPracticeMode = true;
                currentLevelIndex = actualIndex;
                loadLevel(currentLevelIndex);
            } else if (id === 'practice_prev') {
                practicePage = Math.max(0, practicePage - 1);
            } else if (id === 'practice_next') {
                practicePage = Math.min(Math.ceil(levels.length / 10) - 1, practicePage + 1);
            } else if (id === 'times_prev') {
                timesPage = Math.max(0, timesPage - 1);
            } else if (id === 'times_next') {
                timesPage = Math.min(Math.ceil(levels.length / 10) - 1, timesPage + 1);
            } else if (id === 'times_easter_egg') {
                let now = Date.now();
                individualClicks.push(now);
                individualClicks = individualClicks.filter(t => now - t <= 3000);
                if (individualClicks.length >= 3) {
                    showTutorialTime = true;
                    individualClicks = [];
                }
            } else if (id === 'back_practice' || id === 'back_times') {
                menuScreen = 'main';
                showTutorialTime = false;
            }
            
            return;
        } else if (menuScreen === 'settings' && !clickedBtn) {
            if (cx >= 200 && cx <= 500 && cy >= 66 && cy <= 115) {
                let now = Date.now();
                if (now - lastSettingsClickTime > 1000) settingsHeaderClickCount = 0;
                settingsHeaderClickCount++;
                lastSettingsClickTime = now;
                if (settingsHeaderClickCount >= 4) {
                    easterEggUnlocked = true;
                }
            }
        }
    }
});

// Browser zoom shortcuts alter the game's apparent size.
window.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
    if (typeof CloudUI !== 'undefined' && CloudUI.open) {
        if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) e.preventDefault();
        if (e.key === 'Escape' && CloudUI.screen !== 'code' && !CloudUI.busy) CloudUI.hide();
        return;
    }
    if (ReplayPlayer.active) { ReplayPlayer.key(e); return; }
    if ((e.ctrlKey || e.metaKey) && (['+', '=', '-', '_', '0'].includes(e.key) || ['NumpadAdd', 'NumpadSubtract', 'Numpad0'].includes(e.code))) {
        e.preventDefault();
        return;
    }
    if (SplitScreen.handleKey(e, true)) return;
    if (LevelEditor.active && LevelEditor.handleKey(e)) return;
    if (state === 'menu') {
        if (!terminalActive && e.key === 'Escape' && menuScreen !== 'main') {
            e.preventDefault();
            finishVolumeDrag();
            menuScreen = 'main';
            showTutorialTime = false;
            keys = {};
            return;
        }

    }

    if (isPaused) {
        if (e.key === 'Enter') {
            isPaused = false;
            ReplayRecorder.event('resume');
            keys = {};
            Simulation.clearInput();
        }
        return;
    }

    if (terminalActive) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v') return;
        e.preventDefault();
        if (e.key === 'Escape') {
            terminalActive = false;
        } else if (e.key === 'Enter') {
            const rawCommand = terminalInput.trim();
            const cmd = rawCommand.toLowerCase();
            const mergeMatch = rawCommand.match(/^merge_v1\s*=\s*(\S+)$/i);
            if (mergeMatch) {
                const result = mergeV1SaveCode(mergeMatch[1]);
                terminalStatus = result ? `V1: ${result.matched} MATCHED, ${result.updated} UPDATED` : 'INVALID V1 SAVE CODE';
                terminalInput = '';
                return;
            }
            if (cmd === 'sudo cheat = true' || cmd === 'sudo cheats = true') {
                cheatsEnabled = true;
                runInvalidated = true;
                cosmeticFlightEligible = false;
            } else if (cmd === 'sudo cheat = false' || cmd === 'sudo cheats = false') {
                cheatsEnabled = false;
            } else if (/^(?:sudo\s+)?final_level\s*=/.test(cmd)) {
                const val = cmd.split('=')[1].trim();
                if (val === 'default' || val === 'reset') {
                    customFinalLevel = null;
                } else {
                    const parsed = /^\d+$/.test(val)?Number(val):NaN;
                    if (!isNaN(parsed) && parsed > 0 && parsed <= levels.length) {
                        customFinalLevel = parsed - 1;
                        if(ReplayRecorder.campaign)ReplayRecorder.campaign.testFinal=customFinalLevel;
                        runInvalidated = true;
                        cosmeticFlightEligible = false;
                    }
                }
            } else if (cmd.startsWith('sudo reset_level =')) {
                const val = cmd.split('=')[1].trim();
                if (val === 'tutorial') {
                    saveData.bestTutorial = null;
                    storeSaveData();
                } else {
                    const parsed = parseInt(val, 10);
                    if (!isNaN(parsed) && parsed > 0 && parsed <= levels.length) {
                        saveData.bestLevels[parsed - 1] = null;
                        storeSaveData();
                    }
                }
            }
            terminalActive = false;
        } else if (e.key === 'Backspace') {
            terminalInput = terminalInput.slice(0, -1);
        } else if (e.key.length === 1) {
            terminalInput += e.key;
        }
        return;
    }

    const key = e.key.toLowerCase();
    keys[key] = true;
    Simulation.queueKey(e, true);

    if (key === 'escape' && state === 'victory') {
        goToMenu();
        return;
    }

    if (key === 'r') {
        if (state !== 'menu' && state !== 'victory') {
            if (currentLevelIndex === 0 && !isPracticeMode && !currentLevel?.isTutorial) {
                runState = 'inactive';
                RunTiming.reset();
                runInvalidated = cheatsEnabled || customFinalLevel !== null;
            }
            loadLevel(currentLevel?.isTutorial ? -1 : currentLevelIndex);
        }
    }

    if (cheatsEnabled) {
        if (['y', 'u', 'i', 'o', 'p'].includes(key)) {

// Accelerates broad-phase collision by partitioning space into fixed-size cells.
// Each cell stores references to obstacles whose AABBs overlap it.

function createSpatialGrid() {
    const _emptyArr = [];
    let _queryId = 0;
    const _queryResult = [];
    return {
    cellSize: 200,
    cols: 0,
    rows: 0,
    cells: null,          // flat array of arrays, indexed by (row * cols + col)
    staticCells: null,    // snapshot of static-only obstacle lists per cell
    dynamicIndices: [],   // indices of obstacles that are moving/rotating

    build(obstacles, levelWidth, levelHeight) {
        this.cellSize = 200;
        this.cols = Math.ceil(levelWidth / this.cellSize) + 1;
        this.rows = Math.ceil(levelHeight / this.cellSize) + 1;

        const totalCells = this.cols * this.rows;

        // Allocate cell arrays
        this.cells = new Array(totalCells);
        this.staticCells = new Array(totalCells);
        for (let i = 0; i < totalCells; i++) {
            this.cells[i] = [];
            this.staticCells[i] = [];
        }

        this.dynamicIndices = [];

        for (let oi = 0; oi < obstacles.length; oi++) {
            const obs = obstacles[oi];
            const isDynamic = obs.isMoving || obs.isRotating;

            if (isDynamic) {
                this.dynamicIndices.push(oi);
            }

            // Insert into all cells overlapping the AABB
            this._insertObs(obs, isDynamic);
        }

        // Snapshot static cells
        for (let i = 0; i < totalCells; i++) {
            this.staticCells[i] = this.cells[i].slice();
        }
    },

    _insertObs(obs, isDynamic) {
        const aabb = obs.aabb;
        const minCol = Math.max(0, Math.floor(aabb.minX / this.cellSize));
        const maxCol = Math.min(this.cols - 1, Math.floor(aabb.maxX / this.cellSize));
        const minRow = Math.max(0, Math.floor(aabb.minY / this.cellSize));
        const maxRow = Math.min(this.rows - 1, Math.floor(aabb.maxY / this.cellSize));

        for (let r = minRow; r <= maxRow; r++) {
            for (let c = minCol; c <= maxCol; c++) {
                this.cells[r * this.cols + c].push(obs);
            }
        }
    },

    // Call each frame after updating moving/rotating obstacle positions & AABBs
    updateDynamic(obstacles) {
        if (this.dynamicIndices.length === 0) return;

        const totalCells = this.cols * this.rows;

        // Reset cells to static-only snapshot
        for (let i = 0; i < totalCells; i++) {
            const st = this.staticCells[i];
            const cell = this.cells[i];
            cell.length = st.length;
            for (let j = 0; j < st.length; j++) {
                cell[j] = st[j];
            }
        }

        // Re-insert dynamic obstacles with updated AABBs
        for (let i = 0; i < this.dynamicIndices.length; i++) {
            const obs = obstacles[this.dynamicIndices[i]];
            this._insertObs(obs, true);
        }
    },

    // Get obstacles in the cell containing point (x, y)
    query(x, y) {
        const col = Math.floor(x / this.cellSize);
        const row = Math.floor(y / this.cellSize);
        if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return _emptyArr;
        return this.cells[row * this.cols + col];
    },

    // Get deduplicated obstacles overlapping a rectangular region
    queryRect(minX, minY, maxX, maxY) {
        const minCol = Math.max(0, Math.floor(minX / this.cellSize));
        const maxCol = Math.min(this.cols - 1, Math.floor(maxX / this.cellSize));
        const minRow = Math.max(0, Math.floor(minY / this.cellSize));
        const maxRow = Math.min(this.rows - 1, Math.floor(maxY / this.cellSize));

        _queryId++;
        _queryResult.length = 0;

        for (let r = minRow; r <= maxRow; r++) {
            for (let c = minCol; c <= maxCol; c++) {
                const cell = this.cells[r * this.cols + c];
                for (let i = 0; i < cell.length; i++) {
                    const obs = cell[i];
                    if (obs._queryId !== _queryId) {
                        obs._queryId = _queryId;
                        _queryResult.push(obs);
                    }
                }
            }
        }
        return _queryResult;
    }

    let minP = Infinity, maxP = -Infinity;
    for (let i = 0; i < poly.vertices.length; i++) {

        headless: Boolean(options.headless),
        level, viewport: { ...viewport },

        exhaustTimer: 1, screenShake: 0,
        physics: { gravity: BASE_GRAVITY, thrust: BASE_THRUST, rotation: BASE_ROTATION_SPEED }
    };
    session.grid.build(session.obstacles, level.width, level.height);
    session.camera.x = Math.max(0, Math.min(level.startX - viewport.width / 2, level.width - viewport.width));

                targetAngle = menuShip.direction * (Math.PI / 4);

                menuShip.visualThrust = 1.0;
            } else if (menuShip.maneuver === 'dive') {
                targetAngle = menuShip.direction * (Math.PI * 0.6);
                menuShip.physicsThrust = Math.random() > 0.5 ? 1.0 : 0.0;
                menuShip.visualThrust = 1.0;
            } else {
                targetAngle = Math.atan2(menuShip.vx, -menuShip.vy);

            let diff = targetAngle - menuShip.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            menuShip.angle += diff * 0.05 * dt;

            if (menuShip.physicsThrust > 0) {
                menuShip.vx += Math.sin(menuShip.angle) * THRUST * 1.2 * dt;
                menuShip.vy -= Math.cos(menuShip.angle) * THRUST * 1.2 * dt;
            }

            menuShip.vy += GRAVITY * dt;
            menuShip.x += menuShip.vx * dt;
            menuShip.y += menuShip.vy * dt;

            if (menuShip.physicsThrust > 0) {
                const count = Math.floor(Math.random() * 2) + 1;
                const baseX = menuShip.x - Math.sin(menuShip.angle) * (menuShip.h / 2);
                const baseY = menuShip.y + Math.cos(menuShip.angle) * (menuShip.h / 2);

                for (let i = 0; i < count; i++) {
                    let p = getParticle();
                    if (p) {
                        p.active = true;
                        p.x = baseX + (Math.random() - 0.5) * 4;
                        p.y = baseY + (Math.random() - 0.5) * 4;
                        p.vx = menuShip.vx * 0.3 + (Math.random() - 0.5) * 2 - Math.sin(menuShip.angle) * 3;
                        p.vy = menuShip.vy * 0.3 + (Math.random() - 0.5) * 2 + Math.cos(menuShip.angle) * 3;

            if (isSpeedrunMode && !isPracticeMode) {
                tHoldTimer += dt / 60;

function updateSoloFlight(dt) {
    const session = {

        clock: soloFlightClock, phaseTime: flightPhaseTime,
        hasMoved, empActive, thrusterFlicker, exhaustTimer, screenShake,
        physics: { gravity: GRAVITY, thrust: THRUST, rotation: ROTATION_SPEED }

    const actions = Simulation.stepping ? Simulation.actions() : {
        left: keys.a || keys.arrowleft, right: keys.d || keys.arrowright,
        thrust: keys.w || keys.arrowup
    };
    if ((actions.left || actions.right || actions.thrust) && !hasMoved && currentLevelIndex === 0 && !isPracticeMode && !currentLevel.isTutorial && runState === 'inactive') {
        runState = 'active';
        RunTiming.reset();
        RunTiming.tick(dt);
    }
    ReplayRecorder.before(session, dt);
    const outcome = stepFlightSession(session, actions, dt);
    ReplayRecorder.after(session, actions, dt);

        exhaustTimer, screenShake, particleIndex } = session);

function finishSoloLanding() {
    cosmeticUnlockNotice = '';

    timerRunning = false;
    const recordEligible = cosmeticFlightEligible && !cheatsEnabled && customFinalLevel === null && validRecordTime(timer);
    const normAngle = getNormalizedAngle();
    let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;
    let isFinalLevel = (currentLevelIndex === targetFinalIndex);

        AudioSystem.playSafeLand();

    player.vx = 0;
    player.vy = 0;
    player.angle -= normAngle; // Visual seamless snap

    if (currentLevel.isCustom) {
        state = 'won';
        timerRunning = false;
        currentSplitStatus = 'SAME';
        return;
    }

    if (!currentLevel.isTutorial) {
        if (runState === 'active' && !isPracticeMode && (currentLevelIndex !== RunTiming.nextLevel || !recordEligible)) runInvalidated = true;
        // Practice counts too; repeat clears, custom flights, and dev cheats do not.
        if (recordEligible) {
            cosmeticUnlockNotice = ShipCosmetics.recordClear(currentLevelIndex).join(', ');
        }
        let prevBest = saveData.bestLevels[currentLevelIndex];

        if (!recordEligible) {
            currentSplitStatus = 'UNRANKED';
        } else if (prevBest === null || prevBest === undefined) {
            currentSplitStatus = 'NEW';
        } else {
            currentSplitDelta = timer - prevBest;
            if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
            else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
            else currentSplitStatus = 'SAME';
        }

        if (runState === 'active' && !isPracticeMode) {
            let sumBest = 0;
            let hasAllBest = true;
            for (let i = 0; i <= currentLevelIndex; i++) {
                let best = (i === currentLevelIndex) ? prevBest : saveData.bestLevels[i];
                if (best === null || best === undefined) {
                    hasAllBest = false;
                    break;
                }
                sumBest += best;
            }
            if (hasAllBest) {
                currentRunIGTDelta = (currentRunIGT + timer) - sumBest;
            } else {
                currentRunIGTDelta = null;
            }

            let prevRTASplit = saveData.bestRTASplits[currentLevelIndex];
            if (prevRTASplit !== null && prevRTASplit !== undefined) {
                currentRunRTADelta = currentRunRTA - prevRTASplit;
            } else {
                currentRunRTADelta = null;
            }

            if (!runInvalidated && validRecordTime(currentRunRTA) && (prevRTASplit === null || currentRunRTA < prevRTASplit)) {
                saveData.bestRTASplits[currentLevelIndex] = currentRunRTA;
            }
        } else {
            currentRunIGTDelta = null;
            currentRunRTADelta = null;
        }

        if (recordEligible && (prevBest === null || timer < prevBest)) {
            saveData.bestLevels[currentLevelIndex] = timer;
            storeSaveData();
        }

        if (runState === 'active' && !isPracticeMode) {
            RunTiming.complete(currentLevelIndex, timer);
            if (isFinalLevel) {
                const runImpossible = RunTiming.nextLevel !== levels.length || !validRecordTime(currentRunRTA) ||
                    !validRecordTime(currentRunIGT) || currentRunRTA < currentRunIGT - 1e-9;

                victoryData.rta = currentRunRTA;
                victoryData.igt = currentRunIGT;
                victoryData.invalid = runInvalidated || runImpossible || cheatsEnabled || customFinalLevel !== null;

                if (!victoryData.invalid) {
                    victoryData.newRTA = (saveData.bestRTA === null || currentRunRTA < saveData.bestRTA);
                    victoryData.newIGT = (saveData.bestIGT === null || currentRunIGT < saveData.bestIGT);

                    if (customFinalLevel === null) {
                        if (victoryData.newRTA) saveData.bestRTA = currentRunRTA;
                        if (victoryData.newIGT) saveData.bestIGT = currentRunIGT;
                        storeSaveData();
                    }
                } else {
                    victoryData.newRTA = false;
                    victoryData.newIGT = false;
                }

                if (!victoryData.invalid || customFinalLevel!==null) ReplayRecorder.completeRun();
                runState = 'inactive';
            }
        }
        // Keep the next level and its completed totals in a single checkpoint.
        if (!isPracticeMode && !isSpeedrunMode && customFinalLevel===null) {
            SaveStore.checkpointDirty = true;
            saveData.campaignProgress = isFinalLevel ? 0 : currentLevelIndex + 1;
            saveData.casualRTA = isFinalLevel ? 0 : currentRunRTA;

        }
    } else {
        let prevBest = saveData.bestTutorial;

        if (!recordEligible) {
            currentSplitStatus = 'UNRANKED';
        } else if (prevBest === null || prevBest === undefined) {
            currentSplitStatus = 'NEW';
        } else {
            currentSplitDelta = timer - prevBest;
            if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
            else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
            else currentSplitStatus = 'SAME';
        }

        if (recordEligible && (prevBest === null || timer < prevBest)) {
            saveData.bestTutorial = timer;
            storeSaveData();
        }
    }

    if (state === 'won' && isSpeedrunMode && !isPracticeMode) {
        deltaDisplayTimer = 2.0;
        let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;

            loadLevel(currentLevelIndex);
        }
    }
}

function drawSaveNotice() {
    const failed = SaveStore.blocked || SaveStore.status.startsWith('NOT SAVED');
    const message = failed ? `${SaveStore.status}  Save/Load: retry or download backup.` : SaveStore.notice;
    if (!message) return;
